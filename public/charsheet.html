<!doctype html>
<html><head><meta charset="utf-8"><title>Character parts</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#1a1030}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="charparts.js"></script>
<script>
// 🎨 The numbered picture sheets Discord's /character shows (made into public/chars/<sheet>.png). ?sheet=<id> (see SHEETS; keep in step with src/looks.js)
const SHEETS = {
  hair: { part: 'hair', from: 1, to: 25, title: "💇 HAIR 1–25 (men's styles) — /character hair:<number>" },
  hair2: { part: 'hair', from: 26, to: 50, title: "💇 HAIR 26–50 (women's styles) — /character hair:<number>" },
  outfit: { part: 'outfit', from: 1, to: 25, title: "👕 OUTFITS 1–25 (men's) — /character outfit:<number>" },
  outfit2: { part: 'outfit', from: 26, to: 50, title: "👗 OUTFITS 26–50 (women's) — /character outfit:<number>" },
  outfit3: { part: 'outfit', from: 51, to: 75, title: '🦸 OUTFITS 51–75 (costumes) — /character outfit:<number>' },
  makeup: { part: 'makeup', from: 1, to: 25, title: '💄 MAKEUP — /character makeup:<number>' },
  facialhair: { part: 'facialhair', from: 1, to: 25, title: '🧔 FACIAL HAIR — /character facialhair:<number>' },
  body: { part: 'body', from: 1, to: 2, title: '🧍 BODY — /character body:<number>' },
  colors: { title: '🎨 SKIN + HAIR COLOR — /character skin:<n> haircolor:<n>' }
};
const P = new URLSearchParams(location.search).get('sheet') || new URLSearchParams(location.search).get('part') || 'hair', S = SHEETS[P] || SHEETS.hair, C = window.CHAR_PARTS, N = C.NAMES, cv = document.getElementById('c'), g = cv.getContext('2d');
const COLS = ['#d84a4a', '#3a8ad8', '#3aa85a', '#c77dff', '#f0a020', '#e05aa8', '#2ab0b0', '#8a6a4a'];
function drawSheet() { drawSheet0(); frame(); }
function frame() { g.save(); g.strokeStyle = '#fff'; g.lineWidth = 14; g.strokeRect(7, 7, cv.width - 14, cv.height - 14); g.restore(); } // ⬜ a white border, so pictures next to each other in Discord don't blend together (Derek)
function drawSheet0() {
  if (P === 'colors') {
    cv.width = 1400; cv.height = 620; g.fillStyle = '#1a1030'; g.fillRect(0, 0, cv.width, cv.height);
    head(S.title);
    const row = (label, list, names, y) => { g.fillStyle = '#ffd23a'; g.font = "34px 'Lilita One', Impact"; g.textAlign = 'left'; g.fillText(label, 40, y - 18);
      list.forEach((c, i) => { const x = 40 + i * 132; g.fillStyle = c; g.beginPath(); g.roundRect(x, y, 112, 112, 18); g.fill(); g.strokeStyle = '#fff'; g.lineWidth = 3; g.stroke(); g.fillStyle = '#fff'; g.font = "36px 'Lilita One', Impact"; g.textAlign = 'center'; g.strokeStyle = '#000'; g.lineWidth = 6; g.strokeText(i + 1, x + 56, y + 70); g.fillText(i + 1, x + 56, y + 70); g.font = "18px Inter, sans-serif"; g.fillStyle = '#ddd'; g.fillText(names[i], x + 56, y + 136); }); };
    row('SKIN  (skin:<number>)', C.SKIN, N.skin, 150); row('HAIR COLOR  (haircolor:<number>)', C.HAIRC, N.haircolor, 400); return;
  }
  const n = S.to - S.from + 1, cols = Math.min(n, 5), rows = Math.ceil(n / cols), cw = 260, ch = 290, W0 = Math.max(1000, cols * cw + 40), ox = (W0 - cols * cw) / 2;
  cv.width = W0; cv.height = rows * ch + 110; g.fillStyle = '#1a1030'; g.fillRect(0, 0, cv.width, cv.height); head(S.title);
  for (let i = 0; i < n; i++) {
    const num = S.from + i, x = ox + (i % cols) * cw, y = 92 + Math.floor(i / cols) * ch, fem = (S.part === 'hair' && num > 25) || (S.part === 'outfit' && num > 25 && num <= 50) || S.part === 'makeup' || (S.part === 'outfit' && num > 50 && i % 2);
    g.fillStyle = 'rgba(255,255,255,.06)'; g.beginPath(); g.roundRect(x + 6, y + 6, cw - 12, ch - 12, 20); g.fill();
    const look = { hair: fem ? 26 : 1, outfit: fem ? 26 : 1, makeup: 1, facialhair: 1, body: fem ? 2 : 1, skin: 2 + (i % 5), haircolor: 2 + (i % 3) };
    look[S.part] = num; if (S.part === 'body') { look.hair = 26; look.outfit = 1; }
    const t = document.createElement('canvas'); t.width = t.height = 260; const tg = t.getContext('2d'); C.draw(tg, 130, 88, look, null, COLS[i % COLS.length], '★');
    g.drawImage(t, x, y + 14);
    g.fillStyle = '#ffd23a'; g.beginPath(); g.arc(x + 40, y + 40, 27, 0, 7); g.fill(); g.fillStyle = '#2a1408'; g.font = "30px 'Lilita One', Impact"; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(num, x + 40, y + 42);
    g.fillStyle = '#fff'; g.font = "800 21px Inter, sans-serif"; g.fillText(N[S.part][num - 1], x + cw / 2, y + ch - 28);
  }
}
function head(t) { g.fillStyle = '#ffd23a'; g.font = "40px 'Lilita One', Impact, sans-serif"; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(t, cv.width / 2, 48); }
document.fonts?.ready.then(drawSheet) || drawSheet(); setTimeout(drawSheet, 800);
</script></body></html>
