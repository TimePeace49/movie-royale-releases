<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Royal · Setup guide</title>
<style>
  :root { --bg:#120a24; --panel:#1d1238; --panel2:#251849; --line:#3a2a66; --text:#f3edff; --dim:#a898cf; --gold:#ffc94a; --hot:#ff6a3d; --good:#4ade80; --bad:#f87171; --twitch:#9146ff; --discord:#5865f2; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:var(--text); font:15px/1.55 Inter, 'Segoe UI', system-ui, sans-serif; background:radial-gradient(1100px 600px at 70% -10%, #3b1856 0, var(--bg) 60%); }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; border:1px solid var(--line); border-radius:10px; padding:9px 16px; background:var(--panel2); transition:.15s; }
  button:hover { filter:brightness(1.2); }
  button.primary { background:linear-gradient(135deg, var(--gold), var(--hot)); color:#2a1100; font-weight:800; border:0; }
  button.twitch { background:var(--twitch); border:0; color:#fff; font-weight:800; }
  button.discord { background:var(--discord); border:0; color:#fff; font-weight:800; }
  button.big { padding:13px 22px; font-size:17px; border-radius:12px; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  input { width:100%; background:#0f0820; border:1px solid var(--line); border-radius:10px; padding:10px 12px; outline:none; }
  input:focus { border-color:var(--gold); }
  a { color:var(--gold); }
  header { display:flex; align-items:center; gap:16px; padding:14px 26px; border-bottom:1px solid var(--line); background:rgba(18,10,36,.8); position:sticky; top:0; z-index:4; }
  header h1 { margin:0; font-size:22px; font-family:'Lilita One', Impact, sans-serif; color:var(--gold); }
  header .grow { flex:1; }
  .wrap { display:grid; grid-template-columns:290px 1fr; gap:24px; padding:24px 26px; max-width:1250px; margin:0 auto; }
  @media (max-width:900px) { .wrap { grid-template-columns:1fr; } }
  nav { display:flex; flex-direction:column; gap:6px; position:sticky; top:84px; align-self:start; }
  nav button { display:flex; align-items:center; gap:12px; text-align:left; background:transparent; border:1px solid transparent; padding:12px 14px; }
  nav button.on { background:var(--panel); border-color:var(--gold); }
  nav .n { width:30px; height:30px; flex:none; border-radius:50%; display:grid; place-items:center; font-weight:800; background:var(--panel2); border:2px solid var(--line); }
  nav .done .n { background:var(--good); border-color:var(--good); color:#062a12; }
  nav small { display:block; color:var(--dim); font-size:12px; }
  .bar { height:8px; background:#0f0820; border-radius:8px; overflow:hidden; margin:6px 0 14px; } .bar i { display:block; height:100%; background:linear-gradient(90deg, var(--gold), var(--hot)); transition:width .4s; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:26px 30px; }
  .card h2 { margin:0 0 4px; font-size:26px; }
  .why { color:var(--dim); margin:0 0 20px; }
  ol.steps { list-style:none; counter-reset:s; padding:0; margin:0 0 20px; }
  ol.steps > li { counter-increment:s; position:relative; padding:14px 16px 14px 58px; margin-bottom:10px; background:var(--panel2); border-radius:14px; }
  ol.steps > li::before { content:counter(s); position:absolute; left:16px; top:13px; width:28px; height:28px; border-radius:50%; background:var(--gold); color:#2a1100; font-weight:800; display:grid; place-items:center; }
  ol.steps b { color:#fff; }
  .copy { display:flex; gap:8px; margin-top:8px; } .copy input { font-family:ui-monospace, Consolas, monospace; font-size:13px; }
  .field { margin-top:10px; } .field label { display:block; font-size:13px; color:var(--dim); margin-bottom:4px; }
  .ok, .bad, .info { padding:12px 16px; border-radius:12px; margin:14px 0; }
  .ok { background:rgba(74,222,128,.12); border:1px solid rgba(74,222,128,.4); color:#c9f7d8; }
  .bad { background:rgba(248,113,113,.12); border:1px solid rgba(248,113,113,.4); color:#ffd3d3; }
  .info { background:rgba(255,201,74,.08); border:1px solid rgba(255,201,74,.3); color:#ffe9b0; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .foot { display:flex; justify-content:space-between; margin-top:24px; gap:10px; }
  .drop { border:2px dashed var(--line); border-radius:14px; padding:20px; text-align:center; color:var(--dim); margin-top:10px; }
  .drop.over { border-color:var(--gold); color:var(--gold); }
  kbd { background:#0f0820; border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; padding:0 6px; font-size:13px; }
  .tag { font-size:12px; padding:2px 8px; border-radius:20px; background:var(--panel2); color:var(--dim); }
  .tag.new { white-space:nowrap; background:rgba(255,201,74,.18); color:var(--gold); font-weight:700; }
  .choice { background:var(--panel2); border-radius:14px; padding:14px 16px; margin-bottom:10px; }
  .choice h3 { margin:0 0 4px; font-size:17px; } .choice p { margin:0 0 10px; color:var(--dim); }
  .choice .row button.on { background:var(--good); color:#062a12; border-color:var(--good); font-weight:800; }
  ul.list { margin:6px 0 0; padding-left:20px; } ul.list li { margin:3px 0; }
  .help { color:var(--dim); font-size:14px; }
</style>
</head>
<body>
<header><h1>🧭 SETUP GUIDE</h1><span class="grow"></span><a href="/control.html"><button>Skip setup → Movie Royal</button></a></header>
<div class="wrap">
  <nav>
    <div class="muted" id="progressTxt" style="color:var(--dim);font-size:13px"></div>
    <div class="bar"><i id="progress" style="width:0"></i></div>
    <div id="nav"></div>
    <p style="color:var(--dim);font-size:13px;margin-top:10px">Every step is optional. Custom lists and the game work without any of them. Do them in any order — your progress saves as you go.</p>
  </nav>
  <main class="card" id="page">Loading…</main>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let NEW_IDS = null, S = null, A = null, step = new URLSearchParams(location.search).get('step') || null, msg = {};
async function api(url, body, method = 'POST') {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || 'Something went wrong'); return j;
}
const copyBox = v => `<div class="copy"><input readonly value="${esc(v)}" onclick="this.select()"><button onclick="navigator.clipboard.writeText(${esc(JSON.stringify(v))});this.textContent='Copied!';setTimeout(()=>this.textContent='Copy',1500)">Copy</button></div>`;
const link = (url, text) => `<a href="${esc(url)}" target="_blank">${text} ↗</a>`;

const STEPS = [
  { id: 'twitch', title: 'Sign in with Twitch', sub: 'Your account, chat & !join', done: () => !!S.owner && !(A.twitchMissing || []).length },
  { id: 'chatbot', title: 'Chat bot account', sub: 'Talk in chat as a bot (optional)', done: () => !!S.chatBot },
  { id: 'rewards', title: 'Channel points & bits', sub: 'Chaos, wheel & viewer rewards', done: () => !!S.settings.rewardsCreated && S.status.twitch.state === 'online' },
  { id: 'tmdb', title: 'Movie search', sub: 'Title, year, poster, cast', done: () => !!S.settings.tmdbKey },
  { id: 'omdb', title: 'Ratings', sub: 'Rotten Tomatoes + IMDb', done: () => !!S.settings.omdbKey },
  { id: 'letterboxd', title: 'Letterboxd', sub: 'Skip movies you\'ve seen', done: () => S.status.letterboxd.count > 0 },
  { id: 'discord', title: 'Discord bot', sub: '/suggest movies', done: () => S.status.discord.state === 'online' && (A.guilds || []).length > 0 },
  { id: 'cloud', title: '24/7 Discord bot', sub: 'Picks while your PC is off', done: () => !!S.cloud?.enabled },
  { id: 'backup', title: 'Backup bots', sub: 'Keeps Discord answering (optional)', done: () => !!(S.backup?.watching || S.backup?.active) },
  { id: 'chars', title: 'Characters', sub: 'People instead of balls, !id, /character', done: () => !!(S.settings.featAsk?.ids && S.settings.featAsk?.looks) },
  { id: 'donations', title: 'Donations', sub: 'Tips pop up for the wheel', done: () => !!(S.settings.seJwt || S.settings.slToken) },
  { id: 'stream', title: 'Put it on stream', sub: 'OBS window + sound', done: () => !!S.settings.streamSetup },
  { id: 'obs', title: 'OBS control', sub: 'Doomsday, capture window, confetti', done: () => !!(S.settings.obsMic || S.settings.obsCam) },
  { id: 'choice', title: 'Viewer\'s Choice in OBS', sub: 'Confetti on stream', done: () => !!S.choiceObs }
];

async function load() {
  [S, A] = await Promise.all([fetch('/api/state').then(r => r.json()), fetch('/api/app').then(r => r.json())]);
  if (!NEW_IDS) NEW_IDS = new Set(S.settings.setupSeen ? A.guideNew || [] : []); // 🆕 = added to the guide since you last opened it (remembered for this visit)
  if (!S.settings.setupSeen) api('/api/settings', { setupSeen: true }).catch(() => {});
  if (!load.seenSent) { load.seenSent = true; api('/api/setup/seen', { ids: STEPS.map(x => x.id) }).catch(() => {}); } // (you've seen every step in the guide now: no more 🆕 pop-up for them)
  if (!step) step = (STEPS.find(s => !s.done()) || STEPS[0]).id;
  render();
}
function render() {
  const done = STEPS.filter(s => s.done()).length;
  $('progress').style.width = (done / STEPS.length * 100) + '%';
  $('progressTxt').textContent = `${done} of ${STEPS.length} connected`;
  $('nav').innerHTML = STEPS.map((s, i) => `<button class="${s.id === step ? 'on' : ''} ${s.done() ? 'done' : ''}" onclick="go('${s.id}')"><span class="n">${s.done() ? '✓' : i + 1}</span><span>${esc(s.title)}${NEW_IDS?.has(s.id) ? ' <span class="tag new">🆕 new</span>' : ''}<small>${esc(s.sub)}</small></span></button>`).join('');
  const keep = [...document.querySelectorAll('#page input[id]')].reduce((o, el) => (o[el.id] = el.value, o), {});
  const focus = document.activeElement?.id;
  $('page').innerHTML = PAGES[step]();
  for (const [k, v] of Object.entries(keep)) if ($(k) && !$(k).readOnly && v) $(k).value = v;
  if (focus && $(focus)) $(focus).focus();
  PAGES[step + 'After']?.();
}
function go(id) { step = id; msg = {}; history.replaceState(null, '', '?step=' + id); render(); scrollTo(0, 0); }
function nav() {
  const i = STEPS.findIndex(s => s.id === step);
  return `<div class="foot">${i > 0 ? `<button onclick="go('${STEPS[i - 1].id}')">← Back</button>` : '<span></span>'}
    <span style="display:flex;gap:8px;flex-wrap:wrap">${i < STEPS.length - 1
      ? `<button onclick="go('${STEPS[i + 1].id}')" title="You can come back to this any time from Settings → Setup guide">Skip this step ⏭</button>${STEPS[i].done() ? `<button class="primary" onclick="go('${STEPS[i + 1].id}')">Next →</button>` : ''}<a href="/control.html"><button>Skip the rest → Movie Royal</button></a>`
      : `<a href="/control.html"><button class="primary">🎉 Go to Movie Royal</button></a>`}</span></div>`;
}
const status = (ok, okText, badText) => ok ? `<div class="ok">✅ ${okText}</div>` : badText ? `<div class="bad">${badText}</div>` : '';
const note = k => msg[k] ? `<div class="${msg[k].ok ? 'ok' : 'bad'}">${msg[k].ok ? '✅' : '⚠️'} ${msg[k].text}</div>` : '';

const PAGES = {
  twitch() {
    const ready = !!(S.settings.twitchClientId && S.settings.twitchClientSecret), o = S.owner;
    const cb = `http://localhost:${S.port}/twitch/callback`;
    return `<h2>Sign in with Twitch</h2><p class="why">This shows your name and picture, reads your chat (for <b>!join</b> lists and the winner claim), and powers channel points and bits.</p>
    ${o ? status(true, `Signed in as <b>${esc(o.name)}</b>. Chat: ${esc(S.status.twitch.chat)}.`) : ''}
    ${o && (A.twitchMissing || []).length ? `<div class="bad">⚠️ Movie Royal got new features since you signed in, and Twitch needs you to say yes to them. Press <b>Sign in again</b> below and click <b>Authorize</b>. <small>(missing: ${A.twitchMissing.map(esc).join(', ')})</small></div>` : ''}
    ${!ready ? `<p>Twitch needs a free "app" so Movie Royal can sign you in. It takes about 2 minutes, and you only do it once.</p>
    <ol class="steps">
      <li>Open the ${link('https://dev.twitch.tv/console/apps/create', 'Twitch Developer Console')} and sign in with your Twitch account. If it asks, turn on two-factor authentication (Twitch requires it for developer apps).</li>
      <li><b>Name:</b> type anything unique, like <i>MovieRoyal-${esc((S.settings.streamerName || S.owner?.name || 'me').replace(/\W/g, ''))}</i></li>
      <li><b>OAuth Redirect URLs:</b> paste this exactly, then click <b>Add</b>:${copyBox(cb)}</li>
      <li><b>Category:</b> pick <b>Other</b>. <b>Client Type:</b> pick <b>Confidential</b>. Tick the "I'm not a robot" box and click <b>Create</b>.</li>
      <li>You're back on the list of apps. Click <b>Manage</b> next to your new app.</li>
      <li>Copy the <b>Client ID</b> and paste it here:<div class="field"><input id="cid" placeholder="Client ID" autocomplete="off"></div></li>
      <li>Click <b>New Secret</b> (confirm the pop-up), copy the secret and paste it here:<div class="field"><input id="sec" type="password" placeholder="Client Secret" autocomplete="off"></div></li>
      <li>Click <b>Save</b> on the Twitch page, then press the button below.</li>
    </ol>
    ${note('tw')}
    <button class="twitch big" onclick="saveTwitch()">Save &amp; sign in with Twitch</button>`
    : `${o ? '' : `<ol class="steps"><li>Press the purple button. ${A.desktop ? 'Your web browser opens the Twitch sign-in page.' : 'You go to the Twitch sign-in page.'}</li><li>Click <b>Authorize</b>. It asks for a few things: channel points and bits (rewards and chaos), talking in your chat and pinning the winner, moderating (the 💬 Chat tab and watch streaks) and starting raids (the 🚀 Raid reward).</li><li>${A.desktop ? 'When it says "Signed in", close that browser tab and come back here. This page updates by itself.' : 'You come right back here.'}</li></ol>`}
      <div class="row"><button class="twitch big" onclick="location.href='/auth/twitch'">${o ? 'Sign in again' : 'Sign in with Twitch'}</button>
      <button onclick="if(confirm('Re-enter your Twitch app keys?')) api('/api/settings',{twitchClientId:'',twitchClientSecret:''}).then(load)">Change app keys</button></div>
      <div class="info" style="margin-top:16px">If Twitch says <b>"redirect_mismatch"</b>: in the Developer Console, open your app and make sure the redirect URL is exactly:${copyBox(cb)}</div>`}
    ${nav()}`;
  },
  chatbot() {
    const b = S.chatBot;
    return `<h2>🤖 Chat bot account (optional)</h2><p class="why">Movie Royal says things in your Twitch chat: the winner, the claim question (!accept / !pass), replies to commands. Right now it says them as <b>you</b>, with a name tag at the start. With a bot account, they come from the bot instead (for example <b>MoviesRoyalBot</b>).</p>
    ${!S.owner ? `<div class="bad">Sign in with Twitch first (step 1).</div>` : ''}
    ${b ? status(true, `Movie Royal talks in chat as <b>${esc(b.name)}</b>${b.on ? '' : ' (turned off: it talks as you. Settings → 💜 Twitch & channel points)'}.`) : ''}
    <ol class="steps">
      <li>Make a second Twitch account for the bot, for example <b>MoviesRoyalBot</b> (Twitch names can't have spaces). Do it in a <b>private window</b> so you stay logged in as yourself.</li>
      <li>Press <b>🔑 Sign in as the bot</b>. On the Twitch page, if it shows your own account, press <b>Not you?</b> and log in as the bot. Then click <b>Authorize</b>.</li>
      <li>In your Twitch chat, type <code>/mod MoviesRoyalBot</code> (your bot's name) so Twitch never slows it down.</li>
    </ol>
    <div class="row"><button class="twitch big" ${S.owner ? '' : 'disabled'} onclick="location.href='/auth/twitch-bot'">🔑 ${b ? 'Sign in as the bot again' : 'Sign in as the bot'}</button>${b ? `<button onclick="botHi(this)">💬 Say hi in chat</button>` : ''}</div>
    ${note('bot')}
    <p class="help">No bot? That's fine: Movie Royal talks as you, with the name tag from Settings → 💜 Twitch &amp; channel points.</p>
    ${nav()}`;
  },
  backup() {
    const b = S.backup || {}, k = b.backup || {};
    const rel = 'https://github.com/TimePeace49/movie-royale-releases/releases/latest';
    return `<h2>🛡️ Backup bots (optional)</h2><p class="why"><b>Movie Royal Backup Bots</b> is a second, small app. It checks your 24/7 Discord bot every minute, and if that bot has problems, it answers <b>/suggest</b>, <b>/swap</b>, <b>/mymovies</b>… instead. If you don't use the 24/7 bot, it answers whenever Movie Royal is closed. It also keeps reading your Twitch chat while Movie Royal is closed, so viewer profiles and watch streaks keep counting. It can run on your PC or on a friend's.</p>
    ${!S.settings.discordToken ? `<div class="bad">Set up the <b>Discord bot</b> step first.</div>` : ''}
    ${b.active ? `<div class="info">🛡️ ${esc(k.by || 'The backup')} is running your Discord bot right now. Switch back in Movie Royal: Settings → 🤖 Discord &amp; picks.</div>` : b.watching ? status(true, `${esc(k.by || 'A backup')} is watching your bot.`) : ''}
    <ol class="steps">
      <li>Download <b>MovieRoyalBackupBots-Setup</b> from the ${link(rel, 'latest release page')} (under <b>Assets</b>) and install it. It has its own installer, separate from Movie Royal.</li>
      <li>Open <b>Movie Royal Backup Bots</b> (Start menu). Leave it open: it starts by itself with Windows from then on, hidden in the background.</li>
      <li>Press <b>🛡️ Add my bot to the backup on this PC</b>. No copy and paste: it takes your bot from Movie Royal.<div class="row" style="margin-top:8px"><button class="primary" ${S.settings.discordToken ? '' : 'disabled'} onclick="backupAdd(this)">🛡️ Add my bot to the backup on this PC</button></div>${note('bk')}</li>
      <li><b>A friend running your backup instead?</b> They install the same app and paste your Discord bot token in it (Movie Royal → Settings → 🤖 Discord &amp; picks → 📋 Copy my bot token). Whoever has the token fully controls your bot, so only give it to someone you trust, privately.</li>
    </ol>
    <p class="help">Movie Royal Backup Bots updates itself. Picks it takes come into Movie Royal when you open it.</p>
    ${nav()}`;
  },
  chars() {
    const st = S.settings, fa = st.featAsk || {}, cmd = esc(st.idCommand || '!id');
    const yn = (k, yes) => `<div class="row"><button class="${fa[k] === 'yes' ? 'on' : ''}" onclick="charAns('${k}', true)">${yes}</button><button class="${fa[k] === 'no' ? 'on' : ''}" onclick="charAns('${k}', false)">No thanks</button></div>`;
    return `<h2>🧍 Characters</h2><p class="why">Battles can show people instead of balls (the 🧍 box next to every battle). They dress for the map: kung fu outfits in Kung Fu Town, Santa hats in Santa's Workshop… The movie poster or Twitch picture goes on their chest.</p>
    <div class="choice"><h3>👫 Men and women characters?</h3><p>Chat picks what their character is by typing <code>${cmd} man</code>, <code>${cmd} woman</code> or <code>${cmd} none</code> (non-binary). It shows as a tag on their profile too. Anyone can change theirs any time.</p>${yn('ids', '👫 Yes, turn it on')}</div>
    <div class="choice"><h3>🎨 Character creation?</h3><p>People make their own character in Discord with <code>/character</code>: a number for hair, outfit, makeup, facial hair, body, skin, hair color and a head accessory. The bot makes a <b>#${esc(st.charChannelName || 'character-creation')}</b> channel for it, with a link to a page that shows every part. That character is them in every battle with characters.</p>${yn('looks', '🎨 Yes, turn it on')}</div>
    <label style="display:flex;gap:10px;align-items:center;cursor:pointer;margin-top:6px"><input type="checkbox" style="width:auto" ${st.charsDefault ? 'checked' : ''} onchange="api('/api/settings',{charsDefault:this.checked}).then(load)"> 🧍 Battles use characters by default (each battle can still be switched with its 🧍 box)</label>
    ${note('ch')}
    <p class="help">Change any of this later: Settings → ⚔️ Game → 🧍 Characters.</p>
    ${nav()}`;
  },
  rewards() {
    const tw = S.status.twitch, rw = Object.keys(S.settings.rewards || {}), tags = l => l.map(r => `<span class="tag" style="margin:2px;display:inline-block">${esc(r)}</span>`).join(' ');
    return `<h2>Channel points &amp; bits</h2><p class="why">Viewers spend channel points or bits on your stream: chaos in battles (comets, earthquakes, tornadoes… it hits everyone, nobody can buy a win), the 🎡 wheel's rewards, power-ups in chat battles, and fun ones like 💧 Hydrate and 🎉 Viewer's Choice.</p>
    ${!S.owner ? `<div class="bad">Sign in with Twitch first (step 1).</div>` : tw.state !== 'online' ? `<div class="bad">Twitch is "${esc(tw.state)}". ${esc(tw.error || '')}</div>` : ''}
    <div class="info">Channel points and bits need a Twitch <b>Affiliate</b> or <b>Partner</b> channel.</div>
    <ol class="steps">
      <li>Press <b>✨ Make my rewards</b>. It adds the ones you don't have yet (it never changes ones you already have):
        <ul class="list"><li>💥 Chaos for battles: <div style="margin-top:4px">${tags(rw)}</div></li><li>🎡 The wheel: respin, move a spot, grow, double trouble, force stop</li><li>🎉 Chat battle power-ups: shield, mega, turbo, ghost, spiky, magnet</li></ul></li>
      <li>Movie Royal makes these by itself once you're signed in: <b>💧 Hydrate!</b>, <b>🙆 Stretch!</b>, <b>🎩 Pick a hat</b>, <b>🎉 Viewer's Choice</b> and <b>🚀 Raid</b> (pick who you raid at the end of the stream).</li>
      <li>Rewards that can't be used right now are switched off, so they're hidden from the channel points menu (like the wheel's rewards while a battle is on). When you close Movie Royal, they all switch off.</li>
      <li>Change prices, names and on / off in Movie Royal: <b>Settings → 💰 Rewards &amp; prices</b>. Bits and money tiers are there too (a cheer of 100+, 300+, 500+, 1000+ or 2500+ makes a bigger chaos event).</li>
      <li><b>Refunds:</b> Movie Royal never gives channel points back. If you want to refund someone, do it yourself on Twitch.</li>
      <li>Test it: 🧪 Test tab in Movie Royal, or redeem one of the rewards on your channel.</li>
    </ol>
    ${note('rw')}
    ${status(S.settings.rewardsCreated && tw.state === 'online', 'Rewards are set up and Movie Royal is listening.')}
    <button class="primary big" ${S.owner && tw.state === 'online' ? '' : 'disabled'} onclick="makeRewards(this)">✨ Make my rewards</button>
    ${nav()}`;
  },
  tmdb() {
    return `<h2>Movie search</h2><p class="why">TMDB is a free movie database. It powers the title + year search in Discord, the poster, director, cast, genre and synopsis on the winner card, and the 🚫 ban list (movies from this year, documentaries, religious and non-English movies get banned by themselves).</p>
    <ol class="steps">
      <li>Make a free account at ${link('https://www.themoviedb.org/signup', 'themoviedb.org/signup')} and confirm the email they send you.</li>

async function choiceSetup(btn, go = false) {
  btn.disabled = true;
  if (!go) {
    try { const r = await fetch('/api/vr/scenes').then(x => x.json()); if (r.error) throw new Error(r.error); if (!r.scenes?.length) throw new Error('OBS has no scenes.');
      chScenes = { scenes: r.scenes, current: r.current, on: r.picked?.length ? r.picked : r.has?.length ? r.has : [r.current].filter(Boolean) }; msg.choice = null; }
    catch (e) { msg.choice = { ok: false, text: 'Couldn\'t reach OBS: ' + esc(e.message) + '. Do the OBS control step first, with OBS open.' }; }
    return load();
  }
  const scenes = [...document.querySelectorAll('.chSc:checked')].map(i => i.value);
  if (!scenes.length) { btn.disabled = false; msg.choice = { ok: false, text: 'Tick at least one scene.' }; return load(); }
  try { const r = await api('/api/vr/source', { on: true, scenes }); chScenes = null; msg.choice = { ok: true, text: `Added <b>Movie Royal celebration</b> on top of ${r.scenes} OBS scene${r.scenes === 1 ? '' : 's'}: ${r.sceneNames.map(esc).join(', ')}.${r.note ? ' ⚠️ ' + esc(r.note) : ''}` }; }
  catch (e) { msg.choice = { ok: false, text: esc(e.message) }; }
  await load();
}

}

  btn.disabled = true; btn.textContent = 'Connecting…';
  const body = {}; if (se) body.seJwt = se; if (sl) body.slToken = sl; if (Object.keys(body).length) await api('/api/settings', body);
  await new Promise(r => setTimeout(r, 3500)); await load();
  const d = S.status.donations || {}, ok = /online/.test(d.se) || /online/.test(d.sl);
  msg.don = ok ? { ok: true, text: 'Connected! Tips will pop up while the wheel is on stream.' } : { ok: false, text: `Not connected yet (StreamElements: ${esc(d.se)}, Streamlabs: ${esc(d.sl)}). Check the token, or wait a few seconds and press again.` };
  render();
}
async function testOmdbKey(btn) {
  const k = $('omdb').value.trim();
  if (!k && !S.settings.omdbKey) { msg.omdb = { ok: false, text: 'Paste your OMDb key first.' }; return render(); }
  btn.disabled = true; btn.textContent = 'Testing…';
  if (k) await api('/api/settings', { omdbKey: k });
  const r = await api('/api/test/omdb');
  msg.omdb = r.ok ? { ok: true, text: `Working! ${esc(r.sample)}` } : { ok: false, text: esc(r.error || 'No ratings came back.') };
  await load();
}
async function testLb(btn) {
  const u = $('lbu').value.trim().replace(/^https?:\/\/letterboxd\.com\//, '').replace(/\/.*$/, '');
  if (!u) { msg.lb = { ok: false, text: 'Type your Letterboxd username.' }; return render(); }
  btn.disabled = true; btn.textContent = 'Syncing…';
  const r = await api('/api/test/letterboxd', { user: u });
  msg.lb = r.count ? { ok: true, text: `Synced! ${r.count} films known.${r.profileError ? ' (Only recent ones — see below.)' : ''}` } : { ok: false, text: `Couldn't read letterboxd.com/${esc(u)} (${esc(r.profileError || r.rssError || 'no films found')}). Check the spelling and that your profile is public.` };
  await load();
}
async function saveCloud(btn) {
  const token = $('cftok').value.trim(); if (!token) { msg.cf = { ok: false, text: 'Paste your Cloudflare API token first.' }; return render(); }
  btn.disabled = true; btn.textContent = 'Setting up… (up to a minute)';
  try { await api('/api/cloud/enable', { token }); msg.cf = { ok: true, text: '24/7 mode is on! Try /suggest in Discord with Movie Royal closed.' }; }
  catch (e) { msg.cf = { ok: false, text: e.message }; }
  await load();
}
async function saveDiscord(btn) {
  const id = $('dapp').value.trim(), tok = $('dtok').value.trim(), body = {};
  if (id) { if (!/^\d{15,22}$/.test(id)) { msg.dc = { ok: false, text: 'The Application ID is a long number — copy it from General Information.' }; return render(); } body.discordClientId = id; }
  if (tok) body.discordToken = tok;
  if (!body.discordClientId && !S.settings.discordClientId) { msg.dc = { ok: false, text: 'Paste the Application ID.' }; return render(); }
  if (!body.discordToken && !S.settings.discordToken) { msg.dc = { ok: false, text: 'Paste the bot token.' }; return render(); }
  btn.disabled = true; btn.textContent = 'Connecting…';
  await api('/api/settings', body);
  msg.dc = { ok: true, text: 'Saved. Connecting to Discord…' };
  for (let i = 0; i < 12; i++) { await new Promise(r => setTimeout(r, 1000)); await load(); if (S.status.discord.state === 'online' || S.status.discord.state === 'error') break; }
  msg.dc = S.status.discord.state === 'online' ? { ok: true, text: 'Connected! Now add the bot to your server (next step).' } : { ok: false, text: esc(S.status.discord.error || 'Still connecting — check the token.') };
  render();
}

// live updates (e.g. after you sign in with Twitch in your browser)
function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=control`);
  let t; ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'state') { clearTimeout(t); t = setTimeout(async () => { S = m.state; A = await fetch('/api/app').then(r => r.json()); if (!document.activeElement || document.activeElement.tagName !== 'INPUT') render(); }, 200); } };
  ws.onclose = () => setTimeout(connect, 1500);
}
load(); connect();
