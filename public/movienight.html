    const foot = () => { const t = Math.min(SECS, (Date.now() - start) / 1000); $('foot').textContent = done ? `REPLAY OF ${day.toUpperCase()} · ` + (S.leaders.length ? '★ WINNER: ' + S.leaders.join(' / ').toUpperCase() + ' ★' : 'NOBODY VOTED') : `▶ REPLAY OF ${day.toUpperCase()} · ${fmt(t)} / ${fmt(SECS)}` + (last ? '\n' + last : ''); };
    ev.forEach(e => setTimeout(() => { const m = movies[e.i]; m.votes++; if (e.f >= 0 && movies[e.f] && movies[e.f].votes > 0) movies[e.f].votes--; else S.total++; if (e.r === 1) S.guess.right++; last = e.name ? `► ${String(e.name).toUpperCase()} ${e.f >= 0 ? 'CHANGED TO' : 'VOTED'} #${m.n}` : ''; draw(); foot(); }, at(e) * 1000));
    setTimeout(() => { done = true; const top = Math.max(0, ...movies.map(m => m.votes)); S.leaders = top ? movies.filter(m => m.votes === top).map(m => split(m.title)[0]) : []; S.open = false; S.closed = true; draw(); foot(); try { parent.postMessage({ mnReplayDone: 1 }, '*'); } catch {} }, SECS * 1000);
    const tk = setInterval(() => { if (done) return clearInterval(tk); foot(); }, 250); foot();
  };
  if (Q.get('replay') === 'demo') run(demoNight());
  else fetch('/api/movienight/history').then(r => r.json()).then(h => { const N = (h.nights || []).find(n => n.id === Q.get('replay')); if (N) run({ guesser: h.guesser, ...N }); else { S = { show: true, movies: [], total: 0, guess: {}, guesser: '' }; draw(); $('foot').textContent = 'THAT NIGHT ISN\'T IN THE HISTORY ANY MORE'; } }).catch(() => {});
} else if (Q.get('demo')) {
  /* a pretend night: a vote lands every second and a half, so the climbing shows */
  S = { show: true, open: true, endsAt: 0, command: '!vote', total: 0, leaders: [], guesser: Q.get('who') || 'Birx', guess: { right: 0, wrong: 0, total: 0 }, bg: 85, ratings: Q.get('ratings') !== '0', posters: Q.get('posters') !== '0',
    movies: ['Jaws (1975)', 'Alien (1979)', 'The Thing (1982)', 'Clue (1985)', 'Big Trouble in Little China (1986)', 'Tremors (1990)', 'Hackers (1995)', 'The Mummy (1999)'].map((t, i) => ({ id: 'd' + i, n: i + 1, title: t, votes: 0, imdb: [8.1, 8.5, 8.2, 7.2, 7.2, 7.1, 6.2, 7.1][i], rt: [97, 93, 85, 72, 76, 88, 33, 62][i], poster: Q.get('posters') === '0' ? '' : 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='60' height='90'><rect width='60' height='90' fill='hsl(${i * 45},55%,32%)'/><text x='30' y='56' font-size='34' text-anchor='middle' fill='#fff' font-family='Arial'>${t[0]}</text></svg>`) })) };
  draw(); window.__vote = i => { const m = S.movies[i]; if (!m) return; m.votes++; S.total++; if (Math.random() < .6) S.guess.right++; else S.guess.wrong++; draw(); };
  if (Q.get('timer')) { const secs = Math.max(3, Number(Q.get('timer')) || 15); timerMsg({ test: true, endsAt: Date.now() + secs * 1000 }); setTimeout(() => timerMsg({ test: true, done: true, bell: true, vol: 60 }), secs * 1000); } /* ?demo=1&timer=15 = the timer pop-up + the bell */
  if (Q.get('win')) setTimeout(() => winnerMsg({ winners: Q.get('win') === 'tie' ? [{ title: 'The Thing (1982)', votes: 7, imdb: 8.2, rt: 85, by: 'pretend_viewer' }, { title: 'Tremors (1990)', votes: 7, imdb: 7.1, rt: 88 }] : [{ title: 'The Thing (1982)', votes: 7, imdb: 8.2, rt: 85, by: 'pretend_viewer' }], tie: Q.get('win') === 'tie', total: 19, secs: Number(Q.get('secs')) || 20 }), 800); /* ?demo=still&win=1 (or win=tie) = the winner screen */
  if (Q.get('demo') !== 'still') setInterval(() => { if (S.total >= 40) { S.movies.forEach(m => m.votes = 0); S.total = 0; S.guess.right = 0; } window.__vote(Math.floor(Math.random() * S.movies.length)); }, 1500);
} else (function go() { const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?role=movienight'); ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'mnState') { S = m; draw(); } else if (m.type === 'mnTimer') timerMsg(m); else if (m.type === 'mnWinner') winnerMsg(m); }; ws.onclose = () => setTimeout(go, 2000); })();
</script></body></html>
