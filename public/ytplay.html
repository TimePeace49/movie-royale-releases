<!doctype html>
<html><head><meta charset="utf-8"><title>Movie Royal YouTube player</title>
<style>
/* 📺 (1.84.0, Derek: "a brb scene which I will play YouTube videos… also YouTube videos playing while sleeping")
   OBS browser source for the marathon's ☕ Be Right Back (?k=brb) and 😴 Sleeping (?k=sleep) scenes. Plays the YouTube links
   from Movie Royal (🏃 Marathon tab → 📺 YouTube videos) one after another, round and round (or shuffled), and picks up where it
   left off when the scene comes back. See-through when there's nothing to play, so the title screen under it shows.
   ?demo=1 = a test page with no Movie Royal. ws role 'mara': ytCfg (lists) / ytCmd (next, prev, pause, play, reload). */
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: 'Segoe UI', sans-serif; }
#yt, #yt iframe { position: absolute; inset: 0; width: 1920px; height: 1080px; border: 0; }
#yt.off { visibility: hidden; }
#note { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); padding: 10px 24px; border-radius: 30px; background: rgba(10,4,24,.75); color: #fff; font-weight: 800; font-size: 26px; display: none; }
</style></head>
<body>
<div id="yt" class="off"></div>
<div id="note"></div>
<script>
'use strict';
const Q = new URLSearchParams(location.search), K = Q.get('k') === 'sleep' ? 'sleep' : 'brb', DEMO = Q.has('demo');
let P = null, ready = false, ws = null, cfg = { list: [], shuffle: false, vol: 60 }, pos = null, order = [], i = 0, fails = 0, kind = null, paused = false, loadedKey = '';
// a YouTube link → {v: video id} or {list: playlist id}; anything else is skipped
function parse(line) {
  const t = String(line || '').trim(); if (!t) return null;
  if (/^[\w-]{11}$/.test(t)) return { v: t };
  let u; try { u = new URL(/^https?:/i.test(t) ? t : 'https://' + t); } catch { return null; }
  const h = u.hostname.replace(/^(www|m|music)\./, '');
  const list = u.searchParams.get('list');
  if (list && !/^RD/.test(list)) return { list, v: u.searchParams.get('v') || null };
  let v = null;
  if (h === 'youtu.be') v = u.pathname.slice(1, 12);
  else if (/youtube(-nocookie)?\.com$/.test(h)) v = u.searchParams.get('v') || (u.pathname.match(/^\/(?:shorts|live|embed|v)\/([\w-]{11})/) || [])[1] || null;
  return v && /^[\w-]{11}$/.test(v) ? { v } : null;
}
const items = () => cfg.list.map(parse).filter(Boolean);
const send = o => { try { ws && ws.readyState === 1 && ws.send(JSON.stringify({ k: K, ...o })); } catch {} };
const note = t => { const n = document.getElementById('note'); n.textContent = t || ''; n.style.display = t ? 'block' : 'none'; };
function shuffled(n) { const a = [...Array(n).keys()]; for (let j = n - 1; j > 0; j--) { const r = Math.floor(Math.random() * (j + 1)); [a[j], a[r]] = [a[r], a[j]]; } return a; }
function newOrder(keep) {
  const n = items().length;
  if (keep && Array.isArray(keep) && keep.length === n && keep.every(x => x < n)) return keep;
  return cfg.shuffle ? shuffled(n) : [...Array(n).keys()];
}
function play(at, start, sub) {
  const L = items(); if (!L.length || !ready) { document.getElementById('yt').className = 'off'; note(''); return; }
  i = ((at % L.length) + L.length) % L.length; const it = L[order[i] ?? i]; kind = it.list ? 'list' : 'v';
  document.getElementById('yt').className = '';
  P.setVolume(Math.max(0, Math.min(100, Number(cfg.vol) || 0)));
  if (it.list) P.loadPlaylist({ list: it.list, listType: 'playlist', index: sub || 0, startSeconds: start || 0 });
  else P.loadVideoById({ videoId: it.v, startSeconds: start || 0 });
  if (it.list && cfg.shuffle) setTimeout(() => { try { P.setShuffle(true); } catch {} }, 1500);
  paused = false; report();
}
function next(step = 1) { fails = 0; play(i + step, 0, 0); }
function report() {
  if (!P || !ready) return;
  let title = ''; try { title = P.getVideoData()?.title || ''; } catch {}
  let t = 0, sub = 0; try { t = Math.floor(P.getCurrentTime() || 0); sub = kind === 'list' ? (P.getPlaylistIndex() || 0) : 0; } catch {}
  send({ type: 'ytAt', i, t, sub, order, n: items().length, title, paused });
}
function start() { // (after the player is ready and Movie Royal sent the list)
  const L = items(), key = JSON.stringify([cfg.list, cfg.shuffle]);
  if (key === loadedKey) return; const first = !loadedKey; loadedKey = key;
  if (!L.length) { try { P.stopVideo(); } catch {} document.getElementById('yt').className = 'off'; send({ type: 'ytAt', i: 0, t: 0, n: 0, title: '' }); return; }
  const same = first && pos && pos.n === L.length;
  order = newOrder(same ? pos.order : null);
  play(same ? pos.i : 0, same ? pos.t : 0, same ? pos.sub : 0);
}
window.onYouTubeIframeAPIReady = () => {
  P = new YT.Player('yt', {
    width: 1920, height: 1080,
    playerVars: { autoplay: 1, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3, modestbranding: 1, rel: 0, playsinline: 1, origin: location.origin },
    events: {
      onReady: () => { ready = true; start(); },
      onStateChange: e => {
        if (e.data === YT.PlayerState.PLAYING) { fails = 0; note(''); report(); }
        if (e.data === YT.PlayerState.ENDED) { // a video ends (a playlist only says ENDED after its last one)
          if (kind === 'list') { try { const pl = P.getPlaylist() || [], at = P.getPlaylistIndex(); if (at < pl.length - 1) return; } catch {} }
          next();
        }
      },
      onError: e => { // 2 bad link, 100 gone, 101/150 not allowed outside YouTube → skip it (stop if every one fails)
        fails++; send({ type: 'ytErr', i, code: e.data });
        if (fails >= items().length) { note('None of these videos can play here'); return; }
        note('Skipping a video that can\'t play here…'); setTimeout(() => play(i + 1, 0, 0), 1500);
      }
    }
  });
};
function cmd(c) {
  if (!P || !ready) return;
  if (c === 'next') next(1); else if (c === 'prev') next(-1);
  else if (c === 'pause') { P.pauseVideo(); paused = true; report(); }
  else if (c === 'play') { P.playVideo(); paused = false; report(); }
  else if (c === 'reload') { loadedKey = ''; pos = null; start(); }
}
function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=mara`);
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === 'ytCfg' && m[K]) { const c = m[K]; if (!loadedKey && m.pos) pos = m.pos[K] || null; cfg = { list: c.list || [], shuffle: !!c.shuffle, vol: m.vol ?? 60 }; if (ready) { try { P.setVolume(cfg.vol); } catch {} start(); } }
    else if (m.type === 'ytCmd' && m.k === K) cmd(m.cmd);
  };
  ws.onclose = () => setTimeout(connect, 2000);
}
setInterval(report, 10000);
if (DEMO) { cfg = { list: (Q.get('list') || 'https://www.youtube.com/watch?v=jfKfPfyJRdk').split(','), shuffle: false, vol: 30 }; }
else connect();
window.__yt = { parse, items: () => items(), cfg: () => cfg, cmd, state: () => ({ i, kind, ready, order }) };
const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
</script>
</body></html>
