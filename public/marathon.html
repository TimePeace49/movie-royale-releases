<!doctype html>
<html><head><meta charset="utf-8"><title>Movie Royal marathon</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* 🏃 Marathon overlay (1.76.0): an OBS browser source, 1920×1080, see-through. "Battles owed" counter in a corner + the pop-up
   when someone gets a battle (numbered maps + things to give 🍀 luck to). Only OBS shows it, not Movie Royal. ?demo=1 = a pretend one. */
html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; font-family: Nunito, 'Segoe UI', sans-serif; color: #fff; }
.count { position: absolute; display: flex; align-items: center; gap: 16px; padding: 14px 24px 14px 18px; border-radius: 22px; background: linear-gradient(135deg, rgba(30,14,52,.92), rgba(70,20,70,.92)); border: 3px solid #ffcf4a; box-shadow: 0 8px 30px rgba(0,0,0,.5), 0 0 24px rgba(255,207,74,.35); transition: transform .4s cubic-bezier(.2,1.6,.4,1), opacity .4s; }
.count.tl { left: 30px; top: 30px; } .count.tr { right: 30px; top: 30px; } .count.bl { left: 30px; bottom: 30px; } .count.br { right: 30px; bottom: 30px; }
.count .n { font: 400 64px/1 'Lilita One', sans-serif; color: #ffcf4a; text-shadow: 0 3px 0 #7a3c00; min-width: 48px; text-align: center; }
.count .t { font-weight: 900; font-size: 22px; letter-spacing: 2px; text-transform: uppercase; line-height: 1.1; }
.count .nx { font-weight: 700; font-size: 17px; color: #e8dcff; letter-spacing: 0; text-transform: none; margin-top: 3px; max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.count.bump { transform: scale(1.15); }
.count.off { opacity: 0; transform: scale(.8); }
/* (1.82.0) ?mini=1 = the small counter for the gameplay scenes: a little tag at the top middle (pop-ups stay full size) */
.count.mini { padding: 6px 14px 6px 10px; gap: 8px; border-width: 2px; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.45); }
.count.mini .n { font-size: 30px; min-width: 22px; text-shadow: 0 2px 0 #7a3c00; } .count.mini .t { font-size: 13px; letter-spacing: 1.5px; } .count.mini .nx { display: none; }
.count.tc { left: 50%; top: 14px; transform: translateX(-50%); } .count.tc.bump { transform: translateX(-50%) scale(1.15); } .count.tc.off { transform: translateX(-50%) scale(.8); }
.pop { position: absolute; left: 50%; top: 50%; width: 1700px; max-height: 1000px; transform: translate(-50%, -50%) scale(.6); opacity: 0; border-radius: 30px; padding: 26px 34px 20px; box-sizing: border-box;
  background: linear-gradient(160deg, rgba(24,10,44,.96), rgba(56,14,62,.96)); border: 4px solid #ffcf4a; box-shadow: 0 20px 80px rgba(0,0,0,.6), 0 0 60px rgba(255,79,154,.35); transition: transform .45s cubic-bezier(.2,1.5,.4,1), opacity .35s; }
.pop.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.pop h1 { margin: 0; font: 400 66px/1.05 'Lilita One', sans-serif; text-align: center; color: #fff; text-shadow: 0 4px 0 #a01a5c, 0 0 30px rgba(255,79,154,.6); }
.pop h1 b { color: #ffcf4a; font-weight: 400; }
.pop .what { text-align: center; font-size: 24px; font-weight: 800; color: #ffd9f0; margin-top: 4px; }
.pop .how { margin: 14px auto 14px; text-align: center; font-size: 27px; font-weight: 900; padding: 10px 18px; border-radius: 14px; background: rgba(47,224,200,.14); border: 2px solid rgba(47,224,200,.6); }
.pop .how code { font-family: 'Lilita One', sans-serif; font-weight: 400; color: #2fe0c8; font-size: 30px; padding: 0 6px; }
.pop .how .site { color: #ffcf4a; }
.cols { display: grid; grid-template-columns: 1.55fr 1fr; gap: 26px; }
.col h2 { margin: 0 0 8px; font: 400 32px 'Lilita One', sans-serif; color: #ffcf4a; }
.grid { display: grid; gap: 3px 14px; font-size: 19px; font-weight: 800; }
.grid div { display: flex; gap: 8px; align-items: baseline; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 2px 8px; border-radius: 7px; background: rgba(255,255,255,.06); }
.grid i { font-style: normal; color: #ffcf4a; min-width: 30px; text-align: right; font-family: 'Lilita One', sans-serif; font-weight: 400; }
.grid span { overflow: hidden; text-overflow: ellipsis; }
.grid em { margin-left: auto; padding-left: 6px; flex: none; font-style: normal; color: #7dffa5; font-size: .84em; } .grid em.z { color: rgba(255,255,255,.45); }
.bar { height: 8px; border-radius: 6px; background: rgba(255,255,255,.12); margin-top: 16px; overflow: hidden; }
.bar div { height: 100%; width: 100%; background: linear-gradient(90deg, #ffcf4a, #ff4f9a); transform-origin: left; }
.anon .how, .anon .cols { display: none; }
.guess { position: absolute; right: 30px; top: 50%; width: 520px; max-height: 1000px; transform: translate(560px, -50%); transition: transform .5s cubic-bezier(.2,1.3,.4,1); border-radius: 26px; padding: 18px 20px; box-sizing: border-box;
  background: linear-gradient(170deg, rgba(10,30,44,.95), rgba(30,14,52,.95)); border: 4px solid #2fe0c8; box-shadow: 0 16px 60px rgba(0,0,0,.6), 0 0 40px rgba(47,224,200,.35); }
.guess.on { transform: translate(0, -50%); }
.guess h1 { margin: 0; white-space: nowrap; font: 400 38px/1 'Lilita One', sans-serif; text-align: center; color: #2fe0c8; text-shadow: 0 3px 0 #04574d; }
.guess .gt { text-align: center; font: 400 74px/1 'Lilita One', sans-serif; color: #ffcf4a; margin: 6px 0 2px; text-shadow: 0 3px 0 #7a3c00; }
.guess .gh { text-align: center; font-size: 21px; font-weight: 900; margin-bottom: 10px; }
.guess .gh b { color: #2fe0c8; }
.guess .grid { font-size: 21px; gap: 2px 10px; } .guess .grid div { padding: 1px 8px; }
.guess .gn { text-align: center; font-size: 19px; font-weight: 800; margin-top: 10px; color: #e8dcff; }
.win { position: absolute; left: 50%; top: 40px; transform: translate(-50%, -220px); transition: transform .5s cubic-bezier(.2,1.4,.4,1); max-width: 1500px; padding: 18px 34px; border-radius: 22px; text-align: center;
  background: linear-gradient(135deg, rgba(10,40,30,.95), rgba(20,60,50,.95)); border: 4px solid #7dffa5; box-shadow: 0 12px 50px rgba(0,0,0,.6); }
.win.on { transform: translate(-50%, 0); }
.win h1 { margin: 0; font: 400 50px/1.1 'Lilita One', sans-serif; color: #7dffa5; }
.win div { font-size: 26px; font-weight: 900; margin-top: 4px; }
/* ⏱️ (1.82.8, Derek: "a total live time counter on all scenes") */
.clock { position: absolute; display: flex; align-items: center; gap: 12px; padding: 10px 20px 10px 16px; border-radius: 18px; background: linear-gradient(135deg, rgba(30,14,52,.9), rgba(70,20,70,.9)); border: 3px solid #ff4f7a; box-shadow: 0 6px 22px rgba(0,0,0,.45); color: #fff; transition: opacity .4s; }
.clock.tl { left: 30px; top: 30px; } .clock.tr { right: 30px; top: 30px; } .clock.bl { left: 30px; bottom: 30px; } .clock.br { right: 30px; bottom: 30px; }
.clock .dot { width: 16px; height: 16px; border-radius: 50%; background: #ff3a4a; box-shadow: 0 0 12px #ff3a4a; animation: ckDot 1.6s ease-in-out infinite; }
.clock .ct { font: 400 44px/1 'Lilita One', sans-serif; font-variant-numeric: tabular-nums; letter-spacing: 1px; text-shadow: 0 3px 0 #6a1030; }
.clock .cl { font-weight: 900; font-size: 15px; letter-spacing: 2px; text-transform: uppercase; color: #ffd0dc; line-height: 1.1; }
.clock.paused { border-color: #8a7aa8; } .clock.paused .dot { background: #9a8ab8; box-shadow: none; animation: none; } .clock.paused .ct { color: #d8cfe8; }
.clock.hide, .clock.gone { opacity: 0; }
@keyframes ckDot { 50% { opacity: .35; } }
.count .ck { display: none; } .count.mini .ck { display: flex; align-items: center; gap: 6px; margin-left: 6px; padding-left: 10px; border-left: 2px solid rgba(255,255,255,.25); font: 400 22px/1 'Lilita One', sans-serif; font-variant-numeric: tabular-nums; }
.count.mini .ck i { width: 10px; height: 10px; border-radius: 50%; background: #ff3a4a; box-shadow: 0 0 8px #ff3a4a; animation: ckDot 1.6s ease-in-out infinite; }
.count.mini .ck.paused i { background: #9a8ab8; box-shadow: none; animation: none; }
.count.mini.ckOnly .n, .count.mini.ckOnly .t { display: none; } .count.mini.ckOnly .ck { margin: 0; padding: 0; border: 0; }
.count.mini.ckOnly.off { opacity: 1; transform: translateX(-50%); }
/* 🎯 (1.77.0) the big guess pop-up in the middle when guessing starts, then it slides over to the side panel */
.gbig { position: absolute; left: 50%; top: 50%; width: 1600px; max-height: 1010px; box-sizing: border-box; padding: 26px 36px 22px; border-radius: 30px; transform: translate(-50%, -50%) scale(.6); opacity: 0;
  background: linear-gradient(165deg, rgba(10,30,44,.97), rgba(30,14,52,.97)); border: 5px solid #2fe0c8; box-shadow: 0 20px 80px rgba(0,0,0,.6), 0 0 60px rgba(47,224,200,.4); transition: transform .5s cubic-bezier(.2,1.4,.4,1), opacity .4s; }
.gbig.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.gbig.away { opacity: 0; transform: translate(10%, -50%) scale(.32); transition: transform .7s cubic-bezier(.5,0,.3,1), opacity .7s ease-in; }
.gbig h1 { margin: 0; text-align: center; font: 400 84px/1 'Lilita One', sans-serif; color: #2fe0c8; text-shadow: 0 5px 0 #04574d, 0 0 40px rgba(47,224,200,.5); }
.gbig .gb2 { display: flex; align-items: center; justify-content: center; gap: 30px; margin: 10px 0 6px; }
.gbig .gt { font: 400 110px/1 'Lilita One', sans-serif; color: #ffcf4a; text-shadow: 0 4px 0 #7a3c00; }
.gbig .gh { font-size: 30px; font-weight: 900; line-height: 1.25; } .gbig .gh b { color: #2fe0c8; } .gbig .gh .for { color: #ffd9f0; font-size: 24px; }
.gbig .grid { font-size: 28px; gap: 4px 16px; margin-top: 10px; } .gbig .grid div { padding: 3px 10px; }
/* ⏱️ (1.77.0) the exercise timer */
.mt { position: absolute; left: 50%; bottom: 40px; transform: translate(-50%, 260px); transition: transform .5s cubic-bezier(.2,1.4,.4,1); min-width: 640px; max-width: 1400px; padding: 16px 40px 18px; border-radius: 26px; text-align: center; box-sizing: border-box;
  background: linear-gradient(135deg, rgba(30,14,52,.95), rgba(70,20,70,.95)); border: 4px solid #ffcf4a; box-shadow: 0 14px 60px rgba(0,0,0,.6); }
.mt.on { transform: translate(-50%, 0); }
.mt .mw { font: 400 44px/1.1 'Lilita One', sans-serif; color: #ffcf4a; } .mt .mb { font: 400 150px/1 'Lilita One', sans-serif; font-variant-numeric: tabular-nums; text-shadow: 0 5px 0 #7a3c00; } .mt .mh { font-size: 26px; font-weight: 900; color: #e8dcff; }
.mt .mbar { height: 14px; border-radius: 8px; background: rgba(255,255,255,.14); overflow: hidden; margin-top: 10px; } .mt .mbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #46e05a, #ffd23a, #ff3a3a); }
.mt.low .mb { color: #ff5a5a; } .mt.done { border-color: #ff3a3a; animation: mtF .5s steps(2) infinite; } .mt.done .mb { font-size: 120px; color: #ff5a5a; }
@keyframes mtF { 50% { background: linear-gradient(135deg, rgba(160,10,20,.96), rgba(220,40,40,.96)); } }

</style></head>
<body>
<div class="count off" id="count"><div class="n" id="cn">0</div><div class="t"><div id="ct">battles owed</div><div class="nx" id="cx"></div></div><div class="ck" id="ckm"><i></i><span id="ckmt">0:00:00</span></div></div>
<div class="clock gone" id="clock"><div class="dot"></div><div><div class="ct" id="clt">0:00:00</div><div class="cl" id="cll">total live time</div></div></div>
<div class="pop" id="pop"></div>
<div class="guess" id="guess"></div>
<div class="gbig" id="gbig"></div>
<div class="mt" id="mt"></div>
<div class="win" id="win"></div>
<script src="/sfx.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id), esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DEMO = /[?&]demo/.test(location.search), MINI = /[?&]mini=1/.test(location.search), Q = []; let showing = false, last = null, audio = { on: true, sfx: .7 };
// ⏱️ total live time: the server sends the total + whether you're live; this page counts on by itself between messages
const CK = { on: false, ms: 0, live: false, at: 0, corner: 'tr' }; let lastCount = null;
function hms(ms) { const t = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(t / 3600)}:${String(Math.floor(t / 60) % 60).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`; }
function clock(m) { Object.assign(CK, m, { got: Date.now() }); if (lastCount) count(lastCount); clockTick(); }
function clockTick() {
  const ms = CK.ms + (CK.live ? Date.now() - CK.got : 0), t = hms(ms), el = $('clock');
  if (MINI) { el.className = 'clock gone'; const k = $('ckm'); k.style.display = CK.on ? '' : 'none'; k.className = 'ck' + (CK.live ? '' : ' paused'); $('ckmt').textContent = t; return; }
  el.className = 'clock ' + (CK.corner || 'tr') + (CK.live ? '' : ' paused') + (CK.on ? '' : ' gone'); $('clt').textContent = t; $('cll').textContent = CK.live ? 'total live time' : 'total live time (paused)';
}
setInterval(clockTick, 500);
function count(m) {
  const c = $('count'); lastCount = m; c.className = 'count ' + (MINI ? 'mini tc' : (m.corner || 'bl')) + (m.on ? '' : ' off') + (MINI && !m.on && CK.on ? ' ckOnly' : '');
  if (last != null && m.owed > last) { c.classList.add('bump'); setTimeout(() => c.classList.remove('bump'), 450); }
  last = m.owed; $('cn').textContent = m.owed; $('ct').textContent = m.owed === 1 ? 'battle owed' : 'battles owed';
  $('cx').textContent = m.paused ? '⏸ Paused: they run when we\'re back' : m.next?.length ? 'Next: ' + m.next.join(', ') : 'Sub, gift, $5 or 500 bits = a battle';
}
// 🍀 (1.82.4, Derek: "show luck of entry on the pop-up for chat to vote and for when adding luck") every thing shows its luck, 0% too
function lk(x) { const v = Math.round((Number(x.luck) || 0) * 100) / 100; return `<em class="${v ? '' : 'z'}">🍀${v}%</em>`; }
function cols(arr, max) { return Math.max(1, Math.min(max, Math.ceil(arr.length / 17))); }
function pop(m) { Q.push(m); if (!showing) next(); }
function next() {
  const m = Q.shift(); if (!m) { showing = false; return; } showing = true;
  const p = $('pop'), luck = (Math.round(m.luckPer * 100) / 100) + '%', mc = cols(m.maps, 3), ic = cols(m.items, 2);
  p.className = 'pop' + (m.anon ? ' anon' : '');
  p.innerHTML = `<h1>⚔️ <b>${esc(m.who)}</b> got ${m.n === 1 ? 'a battle' : m.n + ' battles'}!</h1><div class="what">${esc(m.what)}${m.owed ? ` · 🎟️ ${m.owed} owed` : ''}${m.paused ? ' · ⏸ battles are paused: yours is safe in the line' : ''}</div>
    <div class="how">Pick a map: <code>map #</code> · give 🍀 +${luck} luck to one thing: <code>luck #</code>${m.site ? ` · or pick at <span class="site">${esc(m.site)}</span>` : ''}</div>
    <div class="cols"><div class="col"><h2>🗺️ Maps</h2><div class="grid" style="grid-template-columns:repeat(${mc},minmax(0,1fr))">${m.maps.map(x => `<div><i>${x.n}</i><span>${esc(x.icon)} ${esc(x.name)}</span></div>`).join('')}</div></div>
    <div class="col"><h2>🍀 Give luck to one</h2><div class="grid" style="grid-template-columns:repeat(${ic},minmax(0,1fr))">${m.items.map(x => `<div><i>${x.n}</i><span>${esc(x.label)}</span>${lk(x)}</div>`).join('')}</div></div></div>
    <div class="bar"><div id="pbar"></div></div>`;
  // (shrink the lists to fit when there are a lot of maps / things)
  requestAnimationFrame(() => { let f = 19; while (p.scrollHeight > 1000 && f > 11) { f--; p.querySelectorAll('.grid').forEach(g => g.style.fontSize = f + 'px'); } p.classList.add('on'); });
  try { if (audio.on && window.SFX) { SFX.init(); SFX.setVolume({ on: true, sfx: audio.sfx, music: 0 }); SFX.play('ding'); setTimeout(() => SFX.play('confettiPop'), 250); } } catch {}
  const secs = m.secs || 40, bar = $('pbar'); bar.style.transition = 'none'; bar.style.transform = 'scaleX(1)';
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transition = `transform ${secs}s linear`; bar.style.transform = 'scaleX(0)'; }));
  setTimeout(() => { p.classList.remove('on'); setTimeout(next, 600); }, secs * 1000);
}
let gT = null, gEnd = 0, gBigT = null, gBigOn = false;
const BIG_SECS = 14; // (how long the big pop-up stays in the middle before it slides to the side)
function guess(m) {
  const g = $('guess'), B = $('gbig'); clearInterval(gT); clearTimeout(gBigT);
  if (!m.on) { g.classList.remove('on'); B.className = 'gbig'; gBigOn = false; return; }
  const fresh = !m.at || Date.now() - m.at < (BIG_SECS - 2) * 1000; // (a page that opens late goes straight to the side panel)
  if (fresh && m.items?.length) {
    const ic = m.items.length > 40 ? 4 : m.items.length > 20 ? 3 : m.items.length > 8 ? 2 : 1;
    B.innerHTML = `<h1>🎯 GUESS THE WINNER!</h1><div class="gb2"><div class="gt" id="gtb"></div><div class="gh">Type the <b>number</b> of the one you think wins in chat.<br>Right = <b>you win a battle!</b> (one guess each)<div class="for">⚔️ This battle is for ${esc(m.who || '')}${m.map ? ` · 🗺️ ${esc(m.map)}` : ''}</div></div></div>
      <div class="grid" style="grid-template-columns:repeat(${ic},minmax(0,1fr))">${m.items.map(x => `<div><i>${x.n}</i><span>${esc(x.label)}</span>${lk(x)}</div>`).join('')}</div>`;
    B.className = 'gbig'; gBigOn = true; g.classList.remove('on');
    requestAnimationFrame(() => { let f = 28; while (B.scrollHeight > 1010 && f > 12) { f--; B.querySelector('.grid').style.fontSize = f + 'px'; } B.classList.add('on'); });
    gBigT = setTimeout(() => { gBigOn = false; B.classList.add('away'); g.classList.add('on'); setTimeout(() => { if (!gBigOn) B.className = 'gbig'; }, 800); }, Math.max(3, BIG_SECS - (m.at ? (Date.now() - m.at) / 1000 : 0)) * 1000);
  }
  gEnd = m.endsAt; const ic = m.items.length > 36 ? 2 : 1;
  g.innerHTML = `<h1>🎯 GUESS THE WINNER</h1><div class="gt" id="gt"></div><div class="gh">Type the <b>number</b> in chat. Right = <b>you win a battle!</b></div>
    <div class="grid" style="grid-template-columns:repeat(${ic},minmax(0,1fr))">${m.items.map(x => `<div><i>${x.n}</i><span>${esc(x.label)}</span>${lk(x)}</div>`).join('')}</div>
    <div class="gn" id="gn"></div>`;
  gn(m); requestAnimationFrame(() => { let f = ic === 2 ? 17 : 21; while (g.scrollHeight > 960 && f > 11) { f--; g.querySelector('.grid').style.fontSize = f + 'px'; } if (!gBigOn) g.classList.add('on'); });
  const tick = () => { const s = Math.max(0, Math.ceil((gEnd - Date.now()) / 1000)), t = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); $('gt').textContent = t; if ($('gtb')) $('gtb').textContent = t; };
  tick(); gT = setInterval(tick, 250);
  try { if (audio.on && window.SFX) { SFX.init(); SFX.setVolume({ on: true, sfx: audio.sfx, music: 0 }); SFX.play('ding'); } } catch {}
}
function gn(m) { const el = $('gn'); if (el) el.textContent = m.count ? `${m.count} guess${m.count === 1 ? '' : 'es'}${m.last?.length ? ': ' + m.last.join(', ') : ''}` : 'No guesses yet: be the first!'; }
function win(m) {
  const w = $('win'); if (!m.total) return;
  w.innerHTML = `<h1>🎯 #${m.n} ${esc(m.label)} won!</h1><div>${m.names.length ? `${esc(m.names.join(', '))} called it: ${m.names.length === 1 ? 'a battle for you!' : 'a battle each!'}` : `Nobody called it (${m.total} guess${m.total === 1 ? '' : 'es'})`}</div>`;
  w.classList.add('on'); try { if (audio.on && m.names.length && window.SFX) SFX.play('confettiPop'); } catch {}
  setTimeout(() => w.classList.remove('on'), 9000);
}
// ⏱️ the exercise timer (Movie Royal says when it starts; the alarm rings here too so stream hears it)
let MT = null, mtOff = 0, mtI = null, mtRang = '';
const mtFmt = s => { s = Math.max(0, Math.ceil(s)); return s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : String(s); };
function timer(m) {
  MT = m.t; mtOff = (m.now || Date.now()) - Date.now(); clearInterval(mtI); const el = $('mt');
  if (!MT) { el.className = 'mt'; return; }
  const left = () => MT.state === 'running' ? (MT.endsAt - (Date.now() + mtOff)) / 1000 : MT.state === 'paused' ? MT.left : MT.state === 'done' ? 0 : MT.secs;
  el.innerHTML = `<div class="mw">🏋️ ${esc(MT.label)}</div><div class="mb" id="mtb"></div><div class="mh" id="mth"></div><div class="mbar"><i id="mtbar"></i></div>`;
