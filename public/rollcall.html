<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Movie Royal · Roll call</title>
<!-- 📣 Roll call on its own (1.61.0, Derek): add this page to OBS as a Browser source (1920 × 1080) in any scene, so roll call
     shows even when the game screen isn't in that scene. See-through except while a roll call runs. ?demo=1 = a pretend one.
     ?sound=1 = play the roll call sounds here too (off by default: the game screen already plays them). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --glass:rgba(18,10,36,.78); }
  html, body { margin:0; height:100%; overflow:hidden; background:transparent; }
  body { font-family:Inter, 'Segoe UI', system-ui, sans-serif; color:#fff; }
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; }
  .display { font-family:'Lilita One', Impact, 'Arial Black', sans-serif; letter-spacing:.5px; }
  .hidden { opacity:0; pointer-events:none; transform:scale(.92) translateY(20px); }
  #roll { position:absolute; left:50%; top:50%; width:1500px; margin-left:-750px; margin-top:-420px; height:840px; box-sizing:border-box;
    background:var(--glass); backdrop-filter:blur(10px); border-radius:28px; padding:30px 40px; transition:all .45s cubic-bezier(.2,1.4,.4,1);
    box-shadow:0 0 0 3px rgba(255,201,74,.35), 0 30px 100px rgba(0,0,0,.55); display:flex; flex-direction:column; }
  #roll .top { display:flex; align-items:center; gap:30px; }
  #roll .clock { font-size:110px; line-height:1; min-width:300px; text-align:center; background:rgba(0,0,0,.25); border-radius:22px; padding:10px 20px; }
  #roll.hurry .clock { color:#ff7b7b; animation:pulse .5s infinite alternate; }
  @keyframes pulse { to { transform:scale(1.05); } }
  @keyframes pop { from { transform:translateY(14px); opacity:0 } }
  #roll h2 { margin:0; font-size:56px; } #roll .sub { font-size:26px; color:#e9defa; margin-top:6px; }
  #roll .count { margin-left:auto; text-align:right; font-size:24px; color:#cbb8ee; } #roll .count b { display:block; font-size:64px; color:#7dffb0; }
  #rgrid { margin-top:26px; flex:1; display:grid; grid-template-columns:repeat(auto-fill, minmax(165px, 1fr)); gap:14px; align-content:start; overflow:hidden; }
  .rp { background:rgba(255,255,255,.06); border-radius:16px; padding:12px; text-align:center; transition:.3s; opacity:.55; filter:grayscale(.8); }
  .rp .av { width:72px; height:72px; border-radius:50%; margin:0 auto 8px; background:#3a2a66; display:flex; align-items:center; justify-content:center; font:800 28px Inter, sans-serif; overflow:hidden; border:3px solid transparent; }
  .rp .av img { width:100%; height:100%; object-fit:cover; }
  .rp .nm { font-weight:800; font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rp small { color:#cbb8ee; font-size:14px; }
  .rp.here { opacity:1; filter:none; background:rgba(125,255,176,.14); box-shadow:0 0 0 2px #7dffb0; animation:pop .35s ease-out; }
  .rp.here .av { border-color:#7dffb0; }
  .rp.gone { opacity:.35; filter:grayscale(1); box-shadow:0 0 0 2px #ff7b7b; }
  #roll .result { font-size:30px; text-align:center; margin-top:14px; display:none; } #roll.done .result { display:block; }
  #hint { position:absolute; left:24px; bottom:20px; font-size:22px; color:#cbb8ee; background:rgba(18,10,36,.7); padding:10px 16px; border-radius:12px; display:none; }
</style>
</head>
<body>
<div id="stage">
  <div id="roll" class="hidden">
    <div class="top">
      <div class="clock display" id="rClock">2:00</div>
      <div><h2 class="display">📣 ROLL CALL!</h2><div class="sub" id="rSub">Type anything in chat to get your movies into the battle!</div></div>
      <div class="count"><b id="rCount">0</b>here</div>
    </div>
    <div id="rgrid"></div>
    <div class="result" id="rResult"></div>
  </div>
  <div id="hint"></div>
</div>
<script src="sfx.js"></script>
<script>
const Q = new URLSearchParams(location.search), DEMO = Q.has('demo'), SOUND = Q.get('sound') === '1';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const snd = (k, o) => { if (SOUND && window.SFX) try { SFX.play(k, o); } catch {} };
function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); $('stage').style.transform = `translate(${(innerWidth - 1920 * k) / 2}px, ${(innerHeight - 1080 * k) / 2}px) scale(${k})`; }
addEventListener('resize', fit); fit();
let rollTimer = null, hideT = null;
function startRoll(m) {
  clearTimeout(hideT);
  const r = $('roll'); r.classList.remove('done', 'hurry');
  $('rResult').textContent = '';
  $('rgrid').innerHTML = m.people.map(p => `<div class="rp ${p.here ? 'here' : ''}" id="rp-${esc(p.key)}"><div class="av">${p.avatar ? `<img src="${esc(p.avatar)}">` : esc((p.name[0] || '?').toUpperCase())}</div><div class="nm">${esc(p.name)}</div><small>${p.movies} movie${p.movies === 1 ? '' : 's'}</small></div>`).join('');
  $('rCount').textContent = `${m.people.filter(p => p.here).length}/${m.people.length}`;
  r.dataset.total = m.people.length;
  r.classList.remove('hidden');
  snd('suddendeath');
  const end = performance.now() + m.seconds * 1000; let last = -1;
  clearInterval(rollTimer);
  rollTimer = setInterval(() => {
    const left = Math.max(0, (end - performance.now()) / 1000), sec = Math.ceil(left);
    $('rClock').textContent = `${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
    r.classList.toggle('hurry', left <= 10);
    if (sec !== last) { last = sec; if (sec <= 10 && sec > 0) snd('tick', { high: sec <= 3 }); }
    if (left <= 0) clearInterval(rollTimer);
  }, 100);
}
function rollHere(key, count) {
  const el = document.getElementById('rp-' + key); if (!el || el.classList.contains('here')) return;
  el.classList.add('here'); snd('lucky');
  $('rCount').textContent = `${count}/${$('roll').dataset.total}`;
}
function endRoll(m) {
  clearInterval(rollTimer);
  const r = $('roll'); r.classList.add('done'); r.classList.remove('hurry');
  document.querySelectorAll('#rgrid .rp:not(.here)').forEach(el => el.classList.add('gone'));
  $('rClock').textContent = '0:00';
  if (m.removed) { snd('buzzer'); $('rResult').innerHTML = `⏰ Time's up! The list is reset with the <b style="color:#7dffb0">${m.here}</b> who showed up. Missed it? Just type in chat to jump back in.`; }
  else { snd('celebrate'); $('rResult').innerHTML = `🎉 Everyone's here! All movies stay in.`; }
  hideT = setTimeout(() => r.classList.add('hidden'), 9000);
}
function closeRoll() { clearInterval(rollTimer); $('roll').classList.add('hidden'); }

if (DEMO) { // 🧪 a pretend roll call (nothing real happens)
  const names = ['Popcorn Pete', 'Reel Goblin', 'VHS Kid', 'Night Owl', 'Mia', 'Big Screen Bob', 'Lena', 'Ozzy', 'Frames', 'Snack Attack', 'Kirb', 'Luna'];
  const people = names.map((n, i) => ({ key: 'd' + i, name: n, avatar: null, here: i < 2, movies: 1 + (i % 3) }));
  const run = () => { startRoll({ seconds: 20, people }); let i = 2; const t = setInterval(() => { if (i >= 9) { clearInterval(t); setTimeout(() => endRoll({ removed: true, here: 9 }), 4000); return; } rollHere('d' + i, i + 1); i++; }, 1400); };
  run(); setInterval(() => { people.forEach((p, i) => p.here = i < 2); run(); }, 36000);
  $('hint').style.display = 'block'; $('hint').textContent = '🧪 Pretend roll call (demo). Remove ?demo=1 from the address for the real one.';
} else {
  let tries = 0;
  const connect = () => {
    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=rollcall`);
    ws.onopen = () => { tries = 0; };
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch { return; }
      if (m.type === 'rollcallStart') startRoll(m);
      else if (m.type === 'rollcallUpdate') rollHere(m.key, m.count);
      else if (m.type === 'rollcallEnd') endRoll(m);
      else if (m.type === 'rollcallClose') closeRoll(); };
    ws.onclose = () => setTimeout(connect, Math.min(10000, 1000 * ++tries)); // Movie Royal closed or restarting: keep trying
  };
  connect();
}
</script>
</body>
</html>
