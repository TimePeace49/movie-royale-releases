<!doctype html>
<html><head><meta charset="utf-8"><title>Screen effect timer</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  /* 🌀⏱️ (1.156.4, Derek: "a timer and the effect in the upper left corner, transparent, not too big") an OBS browser source over the whole screen; shows only while a screen effect plays */
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #tag { position: fixed; left: 22px; top: 18px; display: none; align-items: center; gap: 10px; padding: 6px 14px 6px 10px; border-radius: 12px; background: rgba(10,6,24,.38); color: rgba(255,255,255,.88); font: 800 24px/1.15 Inter, 'Segoe UI', sans-serif; text-shadow: 0 1px 3px rgba(0,0,0,.8); letter-spacing: .2px; }
  #tag.on { display: inline-flex; animation: pop .35s ease-out; }
  #tag .ic { font-size: 26px; }
  #tag .t { font-variant-numeric: tabular-nums; color: rgba(255,226,120,.95); }
  #tag .q { font: 700 15px/1 Inter, sans-serif; color: rgba(255,255,255,.7); }
  #tag.low .t { color: rgba(255,140,120,.98); }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
</style></head>
<body><div id="tag"><span class="ic"></span><span class="n"></span><span class="t"></span><span class="q"></span></div>
<script>
const P = new URLSearchParams(location.search), tag = document.getElementById('tag');
let FX = null, Q = 0, skew = 0;
function set(fx, queue) { if (fx && (!FX || FX.id !== fx.id)) { tag.classList.remove('on'); void tag.offsetWidth; } FX = fx; Q = queue || 0; draw(); }
function draw() {
  if (!FX) { tag.classList.remove('on'); return; }
  const left = FX.paused ? FX.left : Math.max(0, Math.ceil(FX.secs - (Date.now() + skew - FX.at) / 1000));
  if (left <= 0 && !FX.paused) { tag.classList.remove('on'); return; }
  tag.querySelector('.ic').textContent = FX.icon; tag.querySelector('.n').textContent = FX.name;
  tag.querySelector('.t').textContent = (FX.paused ? '⏸ ' : '') + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
  tag.querySelector('.q').textContent = Q ? '+' + Q + ' next' : '';
  tag.classList.toggle('low', left <= 10 && !FX.paused); tag.classList.add('on');
}
setInterval(draw, 250);
window.__fx = set;
if (P.get('demo')) { let i = 0; const L = [['🥴', 'Drunk view'], ['📺', 'Old TV'], ['⚫', 'Black & white']]; const go = () => { const [icon, name] = L[i++ % L.length]; set({ id: 'd' + i, icon, name, at: Date.now(), secs: P.get('demo') === 'still' ? 120 : 15 }, i % 3); }; go(); if (P.get('demo') !== 'still') setInterval(go, 16000); }
else (function go() { const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?role=fxtimer'); ws.onmessage = e => { const m = JSON.parse(e.data); if (m.type === 'screenFx') { if (m.now) skew = m.now - Date.now(); set(m.fx, m.queue); } }; ws.onclose = () => { setTimeout(go, 2000); }; })();
</script></body></html>
