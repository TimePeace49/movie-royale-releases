<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Movie Royal · Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --gold:#ffc94a; --hot:#ff6a3d; --ink:#1a1030; --glass:rgba(18,10,36,.78); }
  html,body { margin:0; height:100%; overflow:hidden; background:transparent; }
  body { font-family: Inter, 'Segoe UI', system-ui, sans-serif; color:#fff; }
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; }
  canvas { position:absolute; inset:0; width:1920px; height:1080px; }
  #fx { pointer-events:none; z-index:20; }
  .display { font-family:'Lilita One', Impact, 'Arial Black', sans-serif; letter-spacing:.5px; }
  .hidden { opacity:0; pointer-events:none; transform:scale(.92) translateY(20px); }
  /* 🎡 the wheel scene */
  #wheelLayer { position:absolute; inset:0; z-index:30; background:radial-gradient(circle at 34% 50%, #3a1f6e 0%, #1b0d36 55%, #0b0518 100%); transition:opacity .4s, transform .4s; }
  #wheelLayer canvas { position:absolute; inset:auto; width:1000px; height:1000px; left:40px; top:40px; }
  #wheelLayer #wlFx { left:0; top:0; width:1920px; height:1080px; pointer-events:none; }
  #wlTitle { position:absolute; left:1090px; right:60px; top:60px; font-size:64px; line-height:1.05; color:var(--gold); text-shadow:0 6px 0 #0006; }
  #wlSub { position:absolute; left:1092px; right:60px; top:140px; font-size:26px; font-weight:700; opacity:.8; }
  #wlCard { position:absolute; left:1090px; right:60px; top:230px; background:rgba(18,10,36,.82); border:3px solid var(--gold); border-radius:28px; padding:30px 34px; box-shadow:0 20px 60px #0008; transition:transform .35s, opacity .35s; }
  #wlCard.off { opacity:0; transform:translateY(30px) scale(.95); }
  #wlCard .k { font-size:24px; font-weight:800; letter-spacing:2px; color:var(--gold); text-transform:uppercase; }
  #wlCard .t { font-size:64px; line-height:1.05; margin:10px 0 8px; word-wrap:break-word; }
  #wlCard .r { font-size:28px; line-height:1.3; white-space:pre-wrap; margin-top:12px; padding:14px 18px; background:#ffffff12; border-radius:16px; }
  #wlCard .r:empty { display:none; }
  #wlCard .m { font-size:22px; font-weight:700; opacity:.85; margin-top:14px; display:flex; gap:18px; flex-wrap:wrap; }
  #wlTimer { position:absolute; left:1090px; right:60px; top:600px; background:rgba(18,10,36,.85); border:3px solid #4fc3ff; border-radius:24px; padding:18px 28px; display:flex; align-items:center; gap:22px; transition:opacity .3s; }
  #wlTimer.off { opacity:0; }
  #wlTimer .n { font-size:92px; line-height:1; font-variant-numeric:tabular-nums; }
  #wlTimer .l { font-size:22px; font-weight:800; opacity:.85; } #wlTimer .bar { height:10px; background:#ffffff22; border-radius:6px; margin-top:10px; overflow:hidden; } #wlTimer .bar i { display:block; height:100%; background:#4fc3ff; }
  #wlTimer.hurry { border-color:#ff4f6d; animation:wlPulse .5s infinite alternate; } #wlTimer.hurry .bar i { background:#ff4f6d; }
  #wlTimer.done { border-color:#ffc94a; }
  @keyframes wlPulse { to { transform:scale(1.03); } }
  .gx { height:1.05em; width:auto; vertical-align:-.18em; }
  #wlMine { display:none; position:absolute; right:60px; top:150px; font-size:22px; font-weight:800; padding:6px 16px; border-radius:30px; background:#ffffff14; }
  #wlBg { position:absolute; inset:0; background-size:cover; background-position:center; }
  #wlBg video { width:100%; height:100%; object-fit:cover; }
  #wlVoid { position:absolute; left:28px; bottom:28px; width:330px; background:rgba(11,11,18,.88); border:2px solid #6b5bd6; border-radius:18px; padding:12px 16px; font-size:19px; font-weight:700; z-index:2; }
  #wlVoid .h { font-size:15px; letter-spacing:2px; color:#b9a8ff; margin-bottom:6px; }
  #wlVoid .x { text-decoration:line-through; opacity:.85; padding:2px 0; }
  #wlRecent { position:absolute; left:1090px; right:60px; bottom:50px; font-size:20px; font-weight:700; }
  #wlRecent div { display:flex; gap:10px; align-items:center; padding:7px 14px; margin-top:6px; background:#ffffff10; border-radius:12px; }
  #wlRecent i { width:14px; height:14px; border-radius:50%; flex:none; }
  #wlRecent .muted { opacity:.6; font-weight:600; margin-left:auto; white-space:nowrap; }
  #wlBanner { position:absolute; left:50%; top:46%; transform:translate(-50%,-50%) scale(.6); opacity:0; font-size:72px; padding:20px 46px; border-radius:30px; background:linear-gradient(90deg,#ff4f6d,#7c6cff); box-shadow:0 20px 70px #000a; white-space:nowrap; transition:all .35s cubic-bezier(.3,1.6,.5,1); z-index:3; text-align:center; }
  #wlBanner small { display:block; font-family:Inter,sans-serif; font-size:28px; font-weight:700; opacity:.9; }
  #wlBanner.on { opacity:1; transform:translate(-50%,-50%) scale(1); }
  /* winner card */
  #win { position:absolute; left:50%; top:50%; width:1180px; margin-left:-590px; margin-top:-300px; z-index:10;
    background:linear-gradient(160deg, rgba(40,20,70,.94), rgba(18,8,34,.96)); border-radius:28px;
    box-shadow:0 0 0 3px rgba(255,201,74,.55), 0 30px 120px rgba(0,0,0,.6), 0 0 160px rgba(255,140,60,.35);
    padding:38px 44px; transition:all .5s cubic-bezier(.2,1.4,.4,1); display:flex; gap:40px; }
  #win .poster { width:300px; height:450px; border-radius:16px; object-fit:cover; background:#2a1a44; box-shadow:0 14px 40px rgba(0,0,0,.5); flex:none; }
  #win .poster.round { width:300px; height:300px; border-radius:50%; margin-top:60px; }
  #win .info { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; }
  #win .kick { color:var(--gold); font-weight:800; text-transform:uppercase; letter-spacing:3px; font-size:22px; }
  #win h1 { margin:10px 0 4px; font-size:74px; line-height:1; text-shadow:0 4px 0 #0006; }
  #win .year { font-size:34px; color:#ffd98a; font-weight:700; }
  #win .meta { margin-top:20px; font-size:24px; line-height:1.55; color:#e9defa; }
  #win .meta b { color:var(--gold); font-weight:800; margin-right:8px; }
  #win .syn { margin-top:16px; font-size:24px; line-height:1.4; color:#fff; font-style:italic; opacity:.92; }
  #win .luckwin { margin-top:14px; font-size:28px; font-weight:800; color:#7dffb0; text-shadow:0 0 18px rgba(80,255,150,.55); }
  #win .luckwin:empty { display:none; }
  #win.vert .luckwin { text-align:center; }
  #win .owner { margin-top:22px; display:flex; align-items:center; gap:14px; font-size:26px; font-weight:700; }
  #win .owner img { width:54px; height:54px; border-radius:50%; border:3px solid var(--gold); }
  #win.simple { width:860px; margin-left:-430px; margin-top:-200px; justify-content:center; text-align:center; }
  #win.simple .info { align-items:center; }
  #win.simple h1 { font-size:96px !important; }
  #win.simple .poster.round { width:180px; height:180px; margin-top:20px; }
  #win .stamp { position:absolute; right:-30px; top:-36px; transform:rotate(9deg); background:var(--hot); color:#fff; padding:12px 26px; border-radius:14px;
    font-size:46px; box-shadow:0 10px 30px rgba(0,0,0,.4); display:none; }
  #win.claimed .stamp { display:block; animation:stamp .6s cubic-bezier(.2,1.8,.4,1); }
  #win .quote { margin-top:14px; font-size:24px; color:#bff3c7; display:none; }
  #win.claimed .quote { display:block; }
  /* movie winner: stacked top to bottom — WINNER, poster, title, year + genre, ratings, who picked it */
  #win.vert { flex-direction:column; align-items:center; text-align:center; width:820px; margin-left:-410px; top:57%; margin-top:0; translate:0 -50%; padding:26px 40px 30px; gap:6px; }
  #win.vert .info { display:contents; }
  #win.vert .kick { font-family:'Lilita One', Impact, sans-serif; font-size:64px; letter-spacing:6px; line-height:1; color:var(--gold); text-shadow:0 4px 0 #0007, 0 0 40px rgba(255,201,74,.5); order:-2; margin-bottom:10px; }
  #win.vert .poster { order:-1; }
  #win.vert .poster { width:260px; height:390px; margin:0; }
  #win.vert h1 { margin:12px 0 0; max-width:100%; }
  #win.vert .year { font-size:30px; }
  #win.vert .meta, #win.vert .syn { display:none; }
  #win.vert .owner { margin-top:16px; justify-content:center; font-size:30px; }
  #win .ratings { display:none; gap:16px; justify-content:center; margin-top:16px; }
  #win.vert .ratings { display:flex; }
  #win .rate { display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.08); border-radius:14px; padding:8px 18px; font-size:30px; font-weight:800; }
  #win .rate .lg { font-size:15px; font-weight:900; letter-spacing:.5px; border-radius:6px; padding:3px 7px; }
  #win .rate .lg.rt { background:#fa320a; color:#fff; } #win .rate .lg.imdb { background:#f5c518; color:#000; } #win .rate .lg.lb { background:#202830; color:#fff; }
  #win .rate .lg.lb i { display:inline-block; width:10px; height:10px; border-radius:50%; margin:0 1px; } 
  #win .rate.wait b { opacity:.45; animation:blink 1s infinite alternate; }
  @keyframes blink { to { opacity:.15 } }
  #win.spotwin .kick { font-size:56px; }
  @keyframes stamp { from { transform:rotate(-20deg) scale(3); opacity:0 } to { transform:rotate(9deg) scale(1); opacity:1 } }
  /* claim timer pop-up */
  #claim { position:absolute; left:50%; top:50%; width:1040px; margin-left:-520px; margin-top:-330px; z-index:11;
    background:var(--glass); backdrop-filter:blur(10px); border-radius:28px; padding:34px 40px; transition:all .45s cubic-bezier(.2,1.4,.4,1);
    box-shadow:0 0 0 3px rgba(255,255,255,.12), 0 30px 100px rgba(0,0,0,.55); display:grid; grid-template-columns:300px 1fr; gap:36px; }
  #claim .ring { position:relative; width:300px; height:300px; }
  #claim .ring svg { transform:rotate(-90deg); }
  #claim .ring .num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:120px; }
  #claim .who { text-align:center; margin-top:18px; font-size:26px; font-weight:800; }
  #claim .who small { display:block; font-size:18px; font-weight:600; color:#cbb8ee; margin-top:4px; }
  #claim h2 { margin:0 0 6px; font-size:46px; }
  #claim .sub { color:#d8c8f5; font-size:22px; margin-bottom:16px; }
  #chat { display:flex; flex-direction:column; gap:8px; height:430px; overflow:hidden; justify-content:flex-end; }
  #chat .m { background:rgba(255,255,255,.07); border-radius:12px; padding:10px 14px; font-size:22px; animation:pop .3s ease-out; }
  #chat .m b { color:#b9a0ff; margin-right:8px; }
  #chat .m.w { background:linear-gradient(90deg, rgba(255,201,74,.35), rgba(255,106,61,.25)); box-shadow:0 0 0 2px var(--gold); }
  #chat .m.w b { color:var(--gold); }
  #chat .empty { color:#a996cc; font-size:20px; text-align:center; padding:30px; }
  @keyframes pop { from { transform:translateY(14px); opacity:0 } }
  #claim.expired .num { color:#ff7b7b; }
  /* roll call */
  #roll { position:absolute; left:50%; top:50%; width:1500px; margin-left:-750px; margin-top:-420px; height:840px; z-index:12;
    background:var(--glass); backdrop-filter:blur(10px); border-radius:28px; padding:30px 40px; transition:all .45s cubic-bezier(.2,1.4,.4,1);
    box-shadow:0 0 0 3px rgba(255,201,74,.35), 0 30px 100px rgba(0,0,0,.55); display:flex; flex-direction:column; }
  #roll .top { display:flex; align-items:center; gap:30px; }
  #roll .clock { font-size:110px; line-height:1; min-width:300px; text-align:center; background:rgba(0,0,0,.25); border-radius:22px; padding:10px 20px; }
  #roll.hurry .clock { color:#ff7b7b; animation:pulse .5s infinite alternate; }
  @keyframes pulse { to { transform:scale(1.05); } }
  #roll h2 { margin:0; font-size:56px; } #roll .sub { font-size:26px; color:#e9defa; margin-top:6px; }
  #roll .count { margin-left:auto; text-align:right; font-size:24px; color:#cbb8ee; } #roll .count b { display:block; font-size:64px; color:#7dffb0; }
  #rgrid { margin-top:26px; flex:1; display:grid; grid-template-columns:repeat(auto-fill, minmax(165px, 1fr)); gap:14px; align-content:start; overflow:hidden; }
  .rp { background:rgba(255,255,255,.06); border-radius:16px; padding:12px; text-align:center; transition:.3s; opacity:.55; filter:grayscale(.8); }
  .rp .av { width:72px; height:72px; border-radius:50%; margin:0 auto 8px; background:#3a2a66; display:flex; align-items:center; justify-content:center; font:800 28px Inter, sans-serif; overflow:hidden; border:3px solid transparent; }
  .rp .av img { width:100%; height:100%; object-fit:cover; }
  .rp .nm { font-weight:800; font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rp small { color:#cbb8ee; font-size:14px; }
  .rp.here { opacity:1; filter:none; background:rgba(125,255,176,.14); box-shadow:0 0 0 2px #7dffb0; animation:pop .35s ease-out; }
  .rp.here .av { border-color:#7dffb0; }
  .rp.gone { opacity:.35; filter:grayscale(1); box-shadow:0 0 0 2px #ff7b7b; }
  #roll .result { font-size:30px; text-align:center; margin-top:14px; display:none; } #roll.done .result { display:block; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="1920" height="1080"></canvas>
  <div id="wheelLayer" class="hidden">
    <div id="wlBg"></div>
    <canvas id="wlCanvas" width="1000" height="1000"></canvas>
    <div id="wlTimer" class="off"><div><div class="l" id="wlTl">⏱️ Timer</div><div class="n display" id="wlTn">0:00</div></div><div style="flex:1"><div class="bar"><i id="wlTb" style="width:100%"></i></div></div></div>
    <div id="wlMine"></div>
    <div id="wlTitle" class="display"></div><div id="wlSub"></div>
    <div id="wlCard" class="off"><div class="k" id="wlK">🎡 The wheel says</div><div class="t display" id="wlT"></div><div class="r" id="wlR"></div><div class="m" id="wlM"></div></div>
    <div id="wlRecent"></div>
    <div id="wlVoid" style="display:none"></div>
    <div id="wlBanner" class="display"></div>
    <canvas id="wlFx" width="1920" height="1080"></canvas>
  </div>
  <div id="win" class="hidden">
    <div class="stamp display">CLAIMED!</div>
    <img class="poster" id="wPoster" alt="">
    <div class="info">
      <div class="kick" id="wKick">🏆 Last one standing</div>
      <h1 class="display" id="wTitle"></h1>
      <div class="year" id="wYear"></div>
      <div class="ratings" id="wRatings"></div>
      <div class="meta" id="wMeta"></div>
      <div class="syn" id="wSyn"></div>
      <div class="owner" id="wOwner"></div>
      <div class="luckwin" id="wLuck"></div>
      <div class="quote" id="wQuote"></div>
    </div>
  </div>
  <div id="claim" class="hidden">
    <div>
      <div class="ring">
        <svg width="300" height="300"><circle cx="150" cy="150" r="130" stroke="rgba(255,255,255,.12)" stroke-width="22" fill="none"/>
          <circle id="ringArc" cx="150" cy="150" r="130" stroke="url(#rg)" stroke-width="22" fill="none" stroke-linecap="round" stroke-dasharray="817" stroke-dashoffset="0"/>
          <defs><linearGradient id="rg"><stop offset="0" stop-color="#ffc94a"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient></defs></svg>
        <div class="num display" id="cNum">30</div>
      </div>
      <div class="who" id="cWho"></div>
    </div>
    <div>
      <h2 class="display" id="cTitle"></h2>
      <div class="sub" id="cSub"></div>
      <div id="chat"></div>
    </div>
  </div>
  <div id="roll" class="hidden">
    <div class="top">
      <div class="clock display" id="rClock">2:00</div>
      <div><h2 class="display">📣 ROLL CALL!</h2><div class="sub" id="rSub">Type anything in chat to get your movies into the battle!</div></div>
      <div class="count"><b id="rCount">0</b>here</div>
    </div>
    <div id="rgrid"></div>
    <div class="result" id="rResult"></div>
  </div>
  <canvas id="fx" width="1920" height="1080"></canvas>
</div>

<script src="sfx.js"></script>
<script src="wheel.js"></script>
<script>
(() => {
// ================= setup =================
const P = new URLSearchParams(location.search);
const DEMO = !!window.ROYAL_DEMO || P.has('demo');
const TRANSPARENT = P.has('transparent');
const stage = document.getElementById('stage');
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const fxc = document.getElementById('fx'), fx = fxc.getContext('2d');
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`; }
addEventListener('resize', fit); fit();
addEventListener('pointerdown', () => SFX.init());
SFX.init();

const W = 1920, H = 1080, CX = 960, CY = 615, K = 0.55, S = 30, SQ3 = Math.sqrt(3);
let R = 10; // cliff size in tiles: grows with the number of pieces
const HW = S * SQ3 / 2; // half hex width
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const sx = x => CX + x, sy = y => CY + y * K;
const PALETTE = ['#ff6a3d', '#ffc94a', '#4ade80', '#38bdf8', '#a78bfa', '#f472b6', '#fb923c', '#2dd4bf', '#f87171', '#facc15', '#60a5fa', '#c084fc'];

const imgCache = {};
function loadImg(url, cb) {
  if (!url) return null;
  if (imgCache[url]) { if (cb) { const im = imgCache[url]; im.complete && im.naturalWidth ? cb(im) : im.addEventListener('load', () => cb(im)); } return imgCache[url]; }
  const im = new Image(); im.decoding = 'async';
  if (cb) im.addEventListener('load', () => cb(im));
  im.src = url; imgCache[url] = im; return im;
}
const ok = im => im && im.complete && im.naturalWidth > 0;

// optional custom art: drop public/assets/background.png (1920x1080) to replace the drawn sky
let customBg = null; { const im = new Image(); im.onload = () => customBg = im; im.src = 'assets/background.png'; }

// ================= state =================
let chaos = { points: true, bits: true }, movieNo = null, voteState = null;
let phase = 'idle', gameId = null, cfg = { lobby: 10, game: 30, fair: true }, kind = 'text', listName = '', totalEntries = 0;
let t = 0, lobbyLeft = 0, endAt = 0, clock = 0;
let tiles = [], tileMap = new Map(), solid = [], fighters = [], parts = [], fxParts = [], banners = [], feed = [], hazards = [], floaters = [], queue = [];
let series = null, seriesMsg = null;
let gatherEnd = 0, gatherLast = -1, chatGate = false, elim = [], elimT = [], evLog = [], pendingCount = 0, lastTick = 0, shake = 0, flash = 0, flashColor = '#fff', winner = null, destined = null, suddenDeath = false, resultSent = false;
const mods = { windX: 0, windY: 0, windUntil: 0, iceUntil: 0, gravUntil: 0, quakeUntil: 0 };

// ================= background =================
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
// the sky is painted by the current map (setMap)
const clouds = Array.from({ length: 9 }, (_, i) => ({ x: rnd(W), y: rnd(120, 520), s: rnd(.6, 1.4), v: rnd(6, 18), a: rnd(.08, .22) }));
function drawSky() {
  if (TRANSPARENT) return;
  if (customBg) ctx.drawImage(customBg, 0, 0, W, H); else ctx.drawImage(bg, 0, 0);
  MAP.animBack?.();
  if (MAP.clouds) for (const c of clouds) {
    c.x += c.v * dtReal; if (c.x > W + 300) c.x = -300;
    ctx.globalAlpha = c.a; ctx.fillStyle = MAP.clouds;
    for (let k = 0; k < 5; k++) { ctx.beginPath(); ctx.ellipse(c.x + k * 55 * c.s, c.y + Math.sin(k * 1.7) * 12 * c.s, 80 * c.s, 26 * c.s, 0, 0, 7); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
function drawFog() {
  if (!MAP.fog || TRANSPARENT) return;
  const gr = ctx.createLinearGradient(0, 820, 0, H);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(.5, MAP.fog[0]); gr.addColorStop(1, MAP.fog[1]);
  ctx.fillStyle = gr; ctx.fillRect(0, 820, W, H - 820);
  ctx.fillStyle = MAP.fog[0];
  for (let i = 0; i < 7; i++) { const x = ((clock * (14 + i * 4) + i * 330) % (W + 600)) - 300; ctx.beginPath(); ctx.ellipse(x, 940 + i * 18, 320, 40, 0, 0, 7); ctx.fill(); }
}

// ================= island =================
const hexDist = (q, r) => (Math.abs(q) + Math.abs(r) + Math.abs(q + r)) / 2;
const toWorld = (q, r) => ({ x: S * SQ3 * (q + r / 2), y: S * 1.5 * r });
function toAxial(x, y) {
  const qf = (SQ3 / 3 * x - y / 3) / S, rf = (2 / 3 * y) / S, sf = -qf - rf;
  let q = Math.round(qf), r = Math.round(rf), s = Math.round(sf);
  const dq = Math.abs(q - qf), dr = Math.abs(r - rf), ds = Math.abs(s - sf);
  if (dq > dr && dq > ds) q = -r - s; else if (dr > ds) r = -q - s;
  return { q, r };
}
const tileAt = (x, y) => { const a = toAxial(x, y); return tileMap.get(a.q + ',' + a.r); };
const isSolid = (x, y) => { const tl = tileAt(x, y); return tl && tl.state < 2; };

function hexPath(g, cx, cy, size, k = K) {
  g.beginPath();
  for (let i = 0; i < 6; i++) { const a = Math.PI / 180 * (60 * i - 30); const px = cx + size * Math.cos(a), py = cy + size * Math.sin(a) * k; i ? g.lineTo(px, py) : g.moveTo(px, py); }

    ctx.fillStyle = '#1a0b30'; ctx.fillRect(-520, 0, 1040, H + 400);
    ctx.fillStyle = '#ffc94a'; ctx.fillRect(-560, 0, 40, H + 400); ctx.fillRect(520, 0, 40, H + 400);
    ctx.fillStyle = '#ff6a3d'; ctx.fillRect(-600, 0, 22, H + 400); ctx.fillRect(578, 0, 22, H + 400);

    ctx.font = "110px 'Lilita One', Impact, sans-serif"; ctx.fillStyle = '#ffc94a'; ctx.fillText('INSTANT', 0, -60); ctx.fillStyle = '#fff'; ctx.fillText('REPLAY', 0, 60);

}
addEventListener('keydown', e => { if (replay && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); skipReplay(); } });
// inside the app's fullscreen: number keys fire powers (free), moving the mouse shows the power bar
addEventListener('keydown', e => { if (/^[0-9]$/.test(e.key)) try { parent !== window && parent.__power?.(e.key === '0' ? 9 : Number(e.key) - 1); } catch {} });
addEventListener('mousemove', () => { try { parent !== window && parent.__stageActivity?.(); } catch {} }, { passive: true });

let last = performance.now(), dtReal = 0;
function frame(now) {

  const dt = dtReal;
  if (replay) stepReplay(dt);

    if (phase === 'lobby') lobbyLeft -= dt;
    for (const f of fighters) { if (f.h > 0) { f.vh -= 1600 * dt; f.h = Math.max(0, f.h + f.vh * dt); if (f.h === 0) { if (f.vh < -400) { SFX.play('land', { p: 1 / Math.sqrt(f.mass) }); f.vh = -f.vh * .35; f.h = .1; shake = Math.max(shake, 2); } else f.vh = 0; } } }

  } else if (phase === 'ended') {

  }

  // ---- draw ----
  ctx.clearRect(0, 0, W, H);
  drawSky();
  ctx.save();

  if (!replay) updateCam(dtReal); applyCam();

    if (MAP.drawWorld) MAP.drawWorld(pre); // maps with stacked floors draw floor by floor
    else {
    for (const f of fighters) if (f.falling && f.y < 0) drawFighter(f);
    for (const tl of tiles) if (tl.state === 2) drawTile(tl);
    for (const tl of tiles) if (tl.state < 2) drawTile(tl);
    drawHazardsGround();
    MAP.drawFloor?.();
    const live = fighters.filter(f => !f.falling).sort((a, b) => a.y - b.y);
    const ys = new Map();
    for (const f of live) ys.set(f, drawFighter(f, pre));
    const crowd = live.length > 50; // big chat battles: names come back once it thins out
    for (const f of live) if (!crowd || f === winner) drawLabel(f, ys.get(f), pre);
    for (const f of fighters) if (f.falling && f.y >= 0) drawFighter(f);
    }

  else if (phase === 'idle' && !TRANSPARENT) { ctx.textAlign = 'center'; ctx.font = "64px 'Lilita One', Impact, sans-serif"; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.fillText('MOVIE ROYAL', CX, 140); ctx.font = "700 24px Inter, sans-serif"; ctx.fillText(connected || DEMO ? 'Waiting for the next round…' : 'Connecting to Movie Royal…', CX, 190); }

// ================= connection =================
let sock = null, connected = false;

function connect() {

  sock.onopen = () => connected = true;
  sock.onclose = () => { connected = false; setTimeout(connect, 2000); };
  sock.onmessage = e => handleMsg(JSON.parse(e.data));
}
function handleMsg(m) {
    if (replay && ['claimStart', 'claimedDirect', 'claimed', 'claimExpired', 'chat'].includes(m.type)) { replay.pending.push(m); return; } // after the replay
    if (replay && (m.type === 'start' || m.type === 'reset' || m.type === 'claimClose')) endReplay(true);
    if (m.type === 'wheel' || m.type === 'wheelSpin') { wheelMsg(m); return; }
    if (m.type === 'wheelTimer') { wlInit(); wlTimer(m.timer, m.ding); return; }
    if (m.type === 'wheelBanner') { wlInit(); if (wlShow) { wlBanner(m.html, 2600); SFX.play('wheelGrow'); } return; }
    if (m.type === 'start') startGame(m);
    else if (m.type === 'preview') applyPreview(m);
    else if (m.type === 'effect') receiveEffect(m.effect);
    else if (m.type === 'queued') SFX.play('queued'), pendingCount++, floaters.push({ scr: 1, text: `${(EV_INFO[m.effect.event] || ['⚡'])[0]} queued for next round!`, x: CX, y: 260, life: 2.5, color: '#ffd98a' });
    else if (m.type === 'audio') SFX.setVolume({ on: m.on, sfx: m.sfx, music: m.music });
    else if (m.type === 'soundTest') { if (m.name === 'music') { SFX.music('fight'); SFX.setIntensity(.7); setTimeout(() => phase !== 'running' && SFX.stopMusic(), 6000); } else if (m.map) SFX.playOn(m.map, m.name); else SFX.play(m.name); }
    else if (m.type === 'reset') { SFX.stopMusic(); phase = 'idle'; fighters = []; hideWin(); hideClaim(); buildIsland(); }
    else if (m.type === 'claimStart') startClaim(m.winner, m.seconds, m.recent);
    else if (m.type === 'chat') addChat(m.msg);
    else if (m.type === 'claimed') claimed(m.text);
    else if (m.type === 'gather') { gatherEnd = m.endsAt || 0; gatherLast = -1; if (gatherEnd) { SFX.play('claimStart'); SFX.music('lobby'); } else if (phase === 'waiting') SFX.stopMusic(); }
    else if (m.type === 'gatherFailed') { SFX.play('buzzer'); floaters.push({ scr: 1, text: 'Not enough movies on the cliff yet!', x: CX, y: 330, life: 4, color: '#ff8a7a' }); }
    else if (m.type === 'rollcallStart') startRoll(m);
    else if (m.type === 'rollcallUpdate') rollHere(m.key, m.count);
    else if (m.type === 'rollcallEnd') endRoll(m);
    else if (m.type === 'rollcallClose') { clearInterval(rollTimer); $('roll').classList.add('hidden'); }
    else if (m.type === 'claimedDirect') { claimWinner = m.winner; claimed(m.text); }
    else if (m.type === 'claimExpired') claimExpired();
    else if (m.type === 'ratings') { ratingsById[m.id] = m.ratings; const f = winner?.id === m.id ? winner : claimWinner?.id === m.id ? claimWinner : null; if (f && !$('win').classList.contains('hidden')) $('wRatings').innerHTML = ratingsHtml(m.ratings, false); }
    else if (m.type === 'reloadSounds') SFX.reload();
    else if (m.type === 'shuffle') shufflePieces();
    else if (m.type === 'vote') { voteState = m.vote; if (m.vote && !m.vote.quiet) SFX.play('claimStart'); }
    else if (m.type === 'series') seriesMsg = m;
    else if (m.type === 'recolor') { for (const f of fighters) if (f.ownerLogin && f.ownerLogin.toLowerCase() === m.login) { f.color = m.color || f.baseColor; makeToken(f); } }
    else if (m.type === 'voteEnd') { voteState = null; SFX.play('fanfare'); floaters.push({ scr: 1, text: `🗺️ CHAT PICKED: ${String(m.name || '').toUpperCase()}`, x: CX, y: 470, life: 4, color: '#ffd34d' }); }
    else if (m.type === 'camera') { if (m.action === 'skip') skipReplay(); else if (m.action) camCmd(m.action); if (m.base) { camOpt.scale = m.base / 1.3; camOpt.base = camOpt.fit * camOpt.scale; } if (m.auto != null) camOpt.auto = m.auto; if (m.replay != null) replayOn = m.replay; }

}
