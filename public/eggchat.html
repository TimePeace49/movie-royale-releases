<!doctype html>
<html><head><meta charset="utf-8"><title>Movie Royal creature chat</title>
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: Inter, "Segoe UI", system-ui, sans-serif; color: #fff; }
  #chat { position: absolute; left: 20px; bottom: 20px; width: 520px; max-height: calc(100% - 40px); display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; overflow: hidden; }
  body.right #chat { left: auto; right: 20px; }
  .m { background: rgba(16, 10, 34, .82); border-radius: 14px; padding: 6px 12px 7px 8px; font-size: 21px; line-height: 1.3; display: flex; gap: 8px; align-items: flex-start; animation: in .25s ease-out; box-shadow: 0 4px 16px rgba(0, 0, 0, .35); overflow-wrap: anywhere; }
  .m img { width: 38px; height: 38px; flex: 0 0 38px; margin-top: -3px; } .m .no { width: 38px; flex: 0 0 38px; text-align: center; opacity: .5; }
  .n { font-weight: 800; } .lv { font-size: 13px; opacity: .7; font-weight: 700; margin-left: 4px; }
  @keyframes in { from { opacity: 0; transform: translateY(12px); } }
  #fight { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); background: rgba(16, 10, 34, .9); border: 2px solid #ffd24b; border-radius: 18px; padding: 10px 22px; display: none; align-items: center; gap: 16px; font-size: 22px; font-weight: 800; } #fight.on { display: flex; animation: in .3s; } #fight img { width: 84px; height: 84px; } #fight .w { color: #ffd24b; } #fight .l { opacity: .55; }
</style></head>
<body><div id="chat"></div><div id="fight"></div>
<script src="/creatures.js"></script>
<script>
// 🥚 A chat box for OBS where everyone's creature sits next to their name (Twitch and Kick can't show a custom picture in their own chat, so this box does).
const Q = new URLSearchParams(location.search), $ = id => document.getElementById(id), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
if (Q.get('side') === 'right') document.body.classList.add('right');
const MAX = Number(Q.get('lines')) || 12, FADE = Number(Q.get('fade')) || 0; let B = {};
function add(m) {
  const b = B[String(m.login || '').toLowerCase()] || B['k:' + String(m.login || '').toLowerCase()], d = document.createElement('div'); d.className = 'm';
  d.innerHTML = `${b ? `<img src="${CREATURES.pic(b.n, 76)}" alt="">` : '<span class="no">🥚</span>'}<span><span class="n" style="color:${/^#[0-9a-f]{6}$/i.test(m.color || '') ? m.color : '#c9a6ff'}">${esc(m.name || m.login)}</span>${b ? `<span class="lv">${esc(CREATURES.info(b.n).name)} Lv ${b.lvl}</span>` : ''}<br>${esc(m.text)}</span>`;
  $('chat').appendChild(d); while ($('chat').children.length > MAX) $('chat').firstChild.remove(); if (FADE) setTimeout(() => d.remove(), FADE * 1000);
}
function fight(f) { const el = $('fight'), side = (x, win) => `<div class="${win ? 'w' : 'l'}" style="text-align:center"><img src="${CREATURES.pic(x.n, 168)}" alt=""><div>${esc(x.name)}</div><div style="font-size:15px">${esc(CREATURES.info(x.n).name)} Lv ${x.lvl}${win ? ' 🏆' : ''}</div></div>`; el.innerHTML = side(f.a, f.win === 0) + `<div>⚔️<br>${f.score[0]}–${f.score[1]}</div>` + side(f.b, f.win === 1); el.classList.add('on'); clearTimeout(fight.t); fight.t = setTimeout(() => el.classList.remove('on'), 9000); }
if (Q.get('demo')) { B = { amy: { n: 3, lvl: 27 }, bob: { n: 17, lvl: 12 }, cat: { n: 112, lvl: 4 } }; [['amy', 'Amy', '#ff7a7a', 'my dragon is ready'], ['bob', 'Bob', '#7ac7ff', '!battle amy'], ['cat', 'Cat', '#b0ff7a', 'go go go'], ['dan', 'Dan', '', 'my egg is at 80%!']].forEach(([login, name, color, text]) => add({ login, name, color, text })); fight({ a: { name: 'Amy', n: 3, lvl: 27 }, b: { name: 'Bob', n: 17, lvl: 12 }, win: 0, score: [2, 1] }); }
else {
  const sock = (role, on) => (function go() { const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?role=' + role); ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch { return; } on(m); }; ws.onclose = () => setTimeout(go, 2000); })();
  sock('eggs', m => { if (m.type === 'eggBadges') B = m.badges || {}; else if (m.type === 'eggBattle') fight(m); });
  sock('chatview', m => { if (m.type === 'chatmsg' && m.msg && !/^!/.test(m.msg.text || '')) add(m.msg); });
}
</script></body></html>
