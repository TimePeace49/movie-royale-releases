<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Royal — Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0b0618; --panel:#140c26; --line:#3a2a5c; --text:#f3edff; --dim:#a99cc9; --gold:#ffc94a; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px Inter, 'Segoe UI', system-ui, sans-serif; }
  #app { display:grid; grid-template-columns:1fr 340px; gap:12px; height:100%; padding:12px; box-sizing:border-box; }
  body.narrow #app { grid-template-columns:1fr; grid-template-rows:1fr 38%; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column; min-height:0; }
  .head { display:flex; gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); }
  .head b { flex:1; }
  #msgs { flex:1; overflow:auto; padding:8px; }
  #say { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); }
  input { background:#0f0820; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px 10px; outline:none; flex:1; min-width:0; }
  button { background:#2a1c47; color:#fff; border:1px solid var(--line); border-radius:10px; padding:7px 11px; cursor:pointer; font:inherit; }
  button.pri { background:linear-gradient(90deg,#ffc94a,#ff8a3d); color:#1a1030; border:0; font-weight:700; }
  .side { display:flex; flex-direction:column; gap:12px; min-height:0; }
  #alerts, #found { overflow:auto; padding:8px; flex:1; }
  .muted { color:var(--dim); font-size:13px; }
  .pill { display:inline-block; padding:2px 8px; margin:2px; border-radius:20px; background:#ffffff12; cursor:pointer; font-size:13px; }
  #paused { display:none; text-align:center; font-size:13px; padding:4px; background:#ffc94a; color:#1a1030; cursor:pointer; }
  .pop { padding:4px 9px; font-size:13px; }
  body.solo #app { grid-template-columns:1fr; grid-template-rows:1fr; }
  body.solo .side { display:contents; }
  body.solo [data-panel]:not(.solo-on) { display:none !important; }
  .warn { padding:8px 12px; background:#3a2a10; color:#ffd98a; font-size:13px; border-bottom:1px solid var(--line); }
</style>
</head>
<body>
<div id="app">
  <div class="card" data-panel="chat">
    <div class="head"><b>💬 <span id="chanName">Chat</span></b><input id="filter" placeholder="🔎 Filter chat…" style="max-width:220px" oninput="drawAll()"><button class="pop" onclick="popOut('chat')" title="Open just the chat in its own window">⧉ Pop out</button><button class="pop" id="popAll" onclick="popOut('all')" title="Open chat, alerts and find someone together in their own window">⧉ All 3</button></div>
    <div id="permWarn"></div>
    <div id="msgs"></div>
    <div id="paused" onclick="stick=true;scrollDown()">⏸ Chat paused while you scroll — click to jump to new messages</div>
    <form id="say" onsubmit="send(event)"><input id="sayTx" placeholder="Send a message in your chat…" autocomplete="off"><button class="pri">Send</button></form>
  </div>
  <div class="side">
    <div class="card" style="flex:1.2" data-panel="alerts"><div class="head"><b>🔔 Alerts</b><span class="muted">subs, gifts, bits, raids, follows, tips…</span><button class="pop" onclick="popOut('alerts')" title="Open the alerts in their own window">⧉ Pop out</button></div><div id="alerts"></div></div>
    <div class="card" style="flex:1" data-panel="find"><div class="head"><b>🔎 Find someone</b><button class="pop" onclick="popOut('find')" title="Open Find someone in its own window">⧉ Pop out</button></div>
      <div style="padding:8px;display:flex;gap:6px"><input id="who" placeholder="Name or part of a name…" oninput="findWho()"><input id="what" placeholder="…or words they said" oninput="findWho()"></div>
      <div id="found" class="muted">Type a name to find them. Click a name to copy it, double-click for their profile.</div></div>
  </div>
</div>
<script src="ask.js"></script>
<script src="chat.js"></script>
<script src="profile.js"></script>
<script>
const $ = id => document.getElementById(id), esc = ChatUI.esc;
const embed = new URLSearchParams(location.search).has('embed');
document.head.insertAdjacentHTML('beforeend', `<style>${ChatUI.CSS}</style>`);
// ?panel=chat | alerts | find opens just that one (each can sit on its own screen)
const solo = new URLSearchParams(location.search).get('panel');
if (solo) { document.body.classList.add('solo'); document.querySelector(`[data-panel="${solo}"]`)?.classList.add('solo-on'); document.title = `Movie Royal — ${{ chat: 'Chat', alerts: 'Alerts', find: 'Find someone' }[solo] || 'Chat'}`; }
document.querySelectorAll('.pop').forEach(b => { if (!embed && (b.id === 'popAll' || solo)) b.style.display = 'none'; }); // a popped-out window can still pop out single panels
let msgs = [], alerts = [], stick = true, info = {};
function scrollDown() { const b = $('msgs'); b.scrollTop = b.scrollHeight; $('paused').style.display = 'none'; }
$('msgs').addEventListener('scroll', () => { const b = $('msgs'); stick = b.scrollHeight - b.scrollTop - b.clientHeight < 40; if (stick) $('paused').style.display = 'none'; });
const show = m => { const q = $('filter').value.trim().toLowerCase(); return !q || `${m.name} ${m.text}`.toLowerCase().includes(q); };
function drawAll() { $('msgs').innerHTML = msgs.filter(show).map(m => ChatUI.row(m, { tools: info.canMod || info.canDelete })).join('') || '<div class="muted" style="padding:10px">No chat yet. Messages show up here as they come in.</div>'; scrollDown(); }
function addMsg(m) { msgs.push(m); if (msgs.length > 1500) msgs.shift(); if (!show(m)) return; const b = $('msgs'); if (b.querySelector('.muted')) b.innerHTML = ''; b.insertAdjacentHTML('beforeend', ChatUI.row(m, { tools: info.canMod || info.canDelete })); if (b.children.length > 1500) b.firstChild.remove(); if (stick) scrollDown(); else $('paused').style.display = 'block'; }
function drawAlerts() { $('alerts').innerHTML = alerts.map(ChatUI.alertRow).join('') || '<div class="muted">Alerts show up here (subs, gift subs, bits, raids, follows, channel point redemptions, watch streaks and donations).</div>'; }
async function load() {
  info = await fetch('/api/chat/recent?n=500').then(r => r.json()); ChatUI.setAssets(info);
  msgs = info.messages; alerts = info.alerts; $('chanName').textContent = info.channel ? '#' + info.channel : 'Chat';
  $('permWarn').innerHTML = info.canMod && info.canDelete ? '' : `<div class="warn">🛡️ To delete messages, time out and ban from here, sign in with Twitch again once (Settings → Account) so Movie Royal gets the new mod permissions.</div>`;
  drawAll(); drawAlerts();
}
function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=chatview`);
  ws.onmessage = e => { const m = JSON.parse(e.data);
    if (m.type === 'chatmsg') addMsg(m.msg);
    else if (m.type === 'chatalert') { alerts.unshift(m.alert); alerts = alerts.slice(0, 200); drawAlerts(); }
    else if (m.type === 'chatclear') { for (const x of msgs) if ((m.id && x.id === m.id) || (m.login && x.login === m.login)) x.gone = m.id ? 'deleted' : m.duration ? `timed out ${m.duration}s` : 'banned'; drawAll(); } };
  ws.onclose = () => setTimeout(connect, 1500);
}
async function send(e) { e.preventDefault(); const t = $('sayTx').value.trim(); if (!t) return; const r = await fetch('/api/chat/say', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: t }) }).then(r => r.json()); if (r.error) alert('⚠️ ' + r.error); else $('sayTx').value = ''; }
let ft; function findWho() { clearTimeout(ft); ft = setTimeout(async () => {
  const who = $('who').value.trim(), what = $('what').value.trim(), box = $('found');
  if (!who && !what) { box.innerHTML = 'Type a name to find them. Click a name to copy it, double-click for their profile.'; return; }
  if (what) { const l = await fetch(`/api/chat/search?q=${encodeURIComponent(what)}&login=${encodeURIComponent(who.toLowerCase())}&days=90`).then(r => r.json()); box.innerHTML = l.length ? l.map(m => `<div style="margin:2px 0">${esc(new Date(m.at).toLocaleDateString())} ${ChatUI.row(m)}</div>`).join('') : 'Nothing found in the last 90 days.'; return; }
  const l = await fetch('/api/chat/names?q=' + encodeURIComponent(who)).then(r => r.json());
  box.innerHTML = l.length ? l.map(v => `<span class="pill" data-user="${esc(v.login)}" title="${v.msgs} messages · last seen ${esc(v.last ? new Date(v.last).toLocaleString() : '')}" onclick="copyName('${esc(v.login)}', this)">${esc(v.name)}</span>`).join('') : 'Nobody by that name has chatted yet.';
}, 250); }
function copyName(n, el) { navigator.clipboard?.writeText(n); const t = el.textContent; el.textContent = '✅ copied'; setTimeout(() => el.textContent = t, 900); }
function popOut(which) {
  const size = { chat: 'width=560,height=860', alerts: 'width=420,height=640', find: 'width=420,height=640', all: 'width=1100,height=860' }[which];
  window.open(which === 'all' ? '/chat.html' : '/chat.html?panel=' + which, 'royal-' + which, size);
}
const fit = () => document.body.classList.toggle('narrow', innerWidth < 760 && !solo); addEventListener('resize', fit); fit();
load(); connect();
</script>
</body>
</html>
