<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Royal — Chat</title>
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
  :root { --bg:#0b0618; --panel:#140c26; --line:#3a2a5c; --text:#f3edff; --dim:#a99cc9; --gold:#ffc94a; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:15px Inter, 'Segoe UI', system-ui, sans-serif; }
  #app { display:grid; grid-template-columns:1fr 340px; gap:12px; height:100%; padding:12px; box-sizing:border-box; }
  body.narrow #app { grid-template-columns:1fr; grid-template-rows:1fr 38%; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column; min-height:0; }
  .head { display:flex; gap:8px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); }
  .head b { flex:1; }
  #msgs { flex:1; overflow:auto; padding:8px; }
  #say { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); }
  input { background:#0f0820; color:var(--text); border:1px solid var(--line); border-radius:10px; padding:8px 10px; outline:none; flex:1; min-width:0; }
  button { background:#2a1c47; color:#fff; border:1px solid var(--line); border-radius:10px; padding:7px 11px; cursor:pointer; font:inherit; }
  button.pri { background:linear-gradient(90deg,#ffc94a,#ff8a3d); color:#1a1030; border:0; font-weight:700; }
  .side { display:flex; flex-direction:column; gap:12px; min-height:0; }
  #alerts, #found { overflow:auto; padding:8px; flex:1; }
  .muted { color:var(--dim); font-size:13px; }
  .pill { display:inline-block; padding:2px 8px; margin:2px; border-radius:20px; background:#ffffff12; cursor:pointer; font-size:13px; }
  #paused { display:none; text-align:center; font-size:13px; padding:4px; background:#ffc94a; color:#1a1030; cursor:pointer; }
  .pop { padding:4px 9px; font-size:13px; }
  body.solo #app { grid-template-columns:1fr; grid-template-rows:1fr; }
  body.solo .side { display:contents; }
  body.solo [data-panel]:not(.solo-on) { display:none !important; }
  .warn { padding:8px 12px; background:#3a2a10; color:#ffd98a; font-size:13px; border-bottom:1px solid var(--line); }
  #msgs .cn[data-user], #alerts b[data-user] { cursor:pointer; } #msgs .cn[data-user]:hover, #alerts b[data-user]:hover { text-decoration:underline; }
</style>
</head>
<body>
<div id="app">
  <div class="card" data-panel="chat">
    <div class="head"><b>💬 <span id="chanName">Chat</span></b><input id="filter" placeholder="🔎 Filter chat…" style="max-width:220px" oninput="drawAll()"><select id="scrollMode" onchange="scrollSet(this.value)" title="How chat scrolls. Auto: follows new messages (scroll up to pause). Pause on hover: stops while your mouse is over chat, catches up when it leaves. Manual: never moves by itself, you scroll it" style="max-width:150px"><option value="auto">⬇ Auto scroll</option><option value="hover">🖱 Pause on hover</option><option value="manual">✋ I scroll it</option></select><button class="pop" onclick="popOut('chat')" title="Open just the chat in its own window">⧉ Pop out</button><button class="pop" id="popAll" onclick="popOut('all')" title="Open chat, alerts and find someone together in their own window">⧉ All 3</button></div>
    <div id="permWarn"></div>
    <div id="msgs"></div>
    <div id="paused" onclick="stick=true;scrollDown()"></div>
    <form id="say" onsubmit="send(event)"><input id="sayTx" placeholder="Send a message in your chat…" autocomplete="off"><button class="pri">Send</button></form>
  </div>
  <div class="side">
    <div class="card" style="flex:1.2" data-panel="alerts"><div class="head"><b>🔔 Alerts</b><span class="muted">subs, gifts, bits, raids, follows, tips…</span><button class="pop" onclick="popOut('alerts')" title="Open the alerts in their own window">⧉ Pop out</button></div><div id="alerts"></div></div>
    <div class="card" style="flex:1" data-panel="find"><div class="head"><b>🔎 Find someone</b><button class="pop" onclick="popOut('find')" title="Open Find someone in its own window">⧉ Pop out</button></div>
      <div style="padding:8px;display:flex;gap:6px"><input id="who" placeholder="Name or part of a name…" oninput="findWho()"><input id="what" placeholder="…or words they said" oninput="findWho()"></div>
      <div id="found" class="muted">Type a name to find them. Click a name to copy it, double-click for their profile.</div></div>
  </div>
</div>
<script src="ask.js"></script>
<script src="chat.js"></script>
<script src="charparts.js"></script>
<script src="profile.js"></script>
<script>
const $ = id => document.getElementById(id), esc = ChatUI.esc;
const embed = new URLSearchParams(location.search).has('embed');
/* 🖱 (1.132.4) right-click menu. On a name: profile, shout out, time out, ban (asks first). In chat: how it scrolls. Inside the Chat tab: the tab's own "turn boxes on / off" menu is one click further */
const PANEL = new URLSearchParams(location.search).get('panel') || '';
function cNote(t, bad) { let n = $('cNote'); if (!n) { n = document.createElement('div'); n.id = 'cNote'; document.body.appendChild(n); } n.textContent = t; n.className = bad ? 'bad' : ''; n.style.display = 'block'; clearTimeout(cNote.t); cNote.t = setTimeout(() => { n.style.display = 'none'; }, 5000); }
function cMenuClose() { $('cMenu')?.remove(); }
async function cPost(url, body) { const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json()).catch(e => ({ error: e.message })); if (r.error) cNote('⚠️ ' + r.error, true); return r; }
async function cAct(what, user, name, test) {
  cMenuClose();
  if (what === 'profile') { if (window.Profile) Profile.open(user); return; }
  if (test && (what === 'so' || what === 'timeout')) { cNote(`🧪 Test: nothing was sent for ${name}`); return; }
  if (what === 'so') { const r = await cPost('/api/shoutout', { name: user }); if (!r.error) cNote(`📣 Shout-out for ${name} sent`); return; }
  if (what === 'timeout') { const r = await cPost('/api/chat/mod', { action: 'timeout', login: user, seconds: 600 }); if (!r.error) cNote(`⏳ ${name} is timed out for 10 minutes`); return; }
  if (what === 'ban') { cBanAsk(user, name, test); return; }
}
function cBanAsk(user, name, test) { /* a ban is easy to hit by accident: always ask first */
  $('cBan')?.remove(); const d = document.createElement('div'); d.id = 'cBan';
  d.innerHTML = `<div class="cBanBox"><b>🔨 Ban ${esc(name)}?</b><p>They won't be able to chat in your channel until you unban them.</p><div class="cBanRow"><button id="cBanNo">Cancel</button><button id="cBanYes" class="danger">Yes, ban ${esc(name)}</button></div></div>`;
  document.body.appendChild(d); const close = () => d.remove(); $('cBanNo').onclick = close; d.addEventListener('mousedown', e => { if (e.target === d) close(); }); $('cBanNo').focus();
  $('cBanYes').onclick = async () => { close(); if (test) { cNote(`🧪 Test: ${name} would be banned now (nothing was sent)`); return; } const r = await cPost('/api/chat/mod', { action: 'ban', login: user }); if (!r.error) cNote(`🔨 ${name} is banned`); };
}
function cMenu(x, y, user, name, inChat, test) {
  cMenuClose(); const m = document.createElement('div'); m.id = 'cMenu'; const it = (txt, js, tip) => `<div class="cmi" title="${esc(tip)}" onclick="${js}">${txt}</div>`, u = esc(user).replace(/'/g, ''), n = esc(name).replace(/'/g, '');
  m.innerHTML = (user ? `<div class="cmh">${esc(name)}</div>` + it('👤 View profile', `cAct('profile','${u}','${n}',${!!test})`, "Open this person's profile") + it('📣 Shout out', `cAct('so','${u}','${n}',${!!test})`, 'Give this person a shout-out in chat') + it('⏳ Time out (10 min)', `cAct('timeout','${u}','${n}',${!!test})`, "This person can't chat for 10 minutes") + it('🔨 Ban…', `cAct('ban','${u}','${n}',${!!test})`, 'Ban this person from your chat (asks you first)') + '<div class="cms"></div>' : '')
    + (inChat ? '<div class="cmh">How chat scrolls</div>' + [['auto', '⬇ Auto scroll', 'Chat follows new messages (scroll up to pause)'], ['hover', '🖱 Pause on hover', 'Chat stops while your mouse is over it and catches up when it leaves'], ['manual', '✋ I scroll it', 'Chat never moves by itself: you scroll it']].map(([k, t, tip]) => it(`${scrollMode === k ? '✓' : '<span style="visibility:hidden">✓</span>'} ${t}`, `scrollSet('${k}');cMenuClose()`, tip)).join('') : '')
    + (embed && parent !== window ? (user || inChat ? '<div class="cms"></div>' : '') + it('▦ Show / hide boxes…', `cMenuClose();parent.postMessage({dashMenuAt:{x:${Math.round(x)},y:${Math.round(y)},panel:'${PANEL}'}},location.origin)`, 'Turn the boxes on this tab on or off') : '');
  if (!m.innerHTML) return false; document.body.appendChild(m);
  m.style.left = Math.max(4, Math.min(innerWidth - m.offsetWidth - 4, x)) + 'px'; m.style.top = Math.max(4, Math.min(innerHeight - m.offsetHeight - 4, y)) + 'px'; return true;
}
document.addEventListener('contextmenu', e => {
  if (e.target.closest('input, textarea, a, #cMenu, #cBan')) return;
  const n = e.target.closest('#msgs .cn[data-user], #alerts b[data-user], #found [data-user]'), inChat = !!e.target.closest('#msgs');
  if (!n && !inChat) { if (embed && parent !== window) { e.preventDefault(); parent.postMessage({ dashMenuAt: { x: e.clientX, y: e.clientY, panel: PANEL } }, location.origin); } return; }
  if (cMenu(e.clientX, e.clientY, n ? n.dataset.user : '', n ? n.textContent.replace(/:$/, '').trim() : '', inChat)) e.preventDefault();
});
document.addEventListener('mousedown', e => { if (!e.target.closest('#cMenu')) cMenuClose(); }); document.addEventListener('mousedown', () => { try { if (parent !== window) parent.postMessage({ dashMenuClose: 1 }, location.origin); } catch {} }, true); addEventListener('message', e => { if (e.data?.cMenuClose && e.origin === location.origin) { cMenuClose(); } }); addEventListener('blur', cMenuClose); document.addEventListener('keydown', e => { if (e.key === 'Escape') { cMenuClose(); $('cBan')?.remove(); } });
window.cMenuTest = ban => { const n = [...document.querySelectorAll('#msgs .cn[data-user]')].pop(); if (!n) return false; const r = n.getBoundingClientRect(); cMenu(r.left + 10, r.bottom + 2, n.dataset.user, n.textContent.replace(/:$/, '').trim(), true, true); if (ban) cAct('ban', n.dataset.user, n.textContent.replace(/:$/, '').trim(), true); return true; };
document.head.insertAdjacentHTML('beforeend', `<style>#cMenu{position:fixed;z-index:9000;min-width:200px;background:#1d1238;border:1px solid rgba(255,255,255,.22);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.6);padding:6px 0;font-size:14px;color:#fff}#cMenu .cmi{padding:6px 14px;cursor:pointer;white-space:nowrap}#cMenu .cmi:hover{background:rgba(255,255,255,.12)}#cMenu .cmh{padding:4px 14px;font-size:12px;color:#b9aede;font-weight:700}#cMenu .cms{height:1px;background:rgba(255,255,255,.15);margin:5px 0}#cNote{position:fixed;left:50%;bottom:58px;transform:translateX(-50%);z-index:9100;background:#1d1238;border:1px solid rgba(255,255,255,.25);border-radius:10px;padding:8px 14px;font-size:14px;color:#fff;display:none;max-width:90%}#cNote.bad{border-color:#ff7a7a}#cBan{position:fixed;inset:0;z-index:9200;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:12px}#cBan .cBanBox{background:#1d1238;border:2px solid #ff7a7a;border-radius:14px;padding:16px;max-width:340px;color:#fff;font-size:15px}#cBan p{margin:8px 0 14px;color:#cfc6ea;font-size:14px}#cBan .cBanRow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}#cBan button{padding:7px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:#2c2050;color:#fff;font:inherit;cursor:pointer}#cBan button.danger{background:#c62f3d;border-color:#ff7a7a;font-weight:700}</style>`);
document.head.insertAdjacentHTML('beforeend', `<style>${ChatUI.CSS}</style>`);
// ?panel=chat | alerts | find opens just that one (each can sit on its own screen)
const solo = new URLSearchParams(location.search).get('panel');
if (solo) { document.body.classList.add('solo'); document.querySelector(`[data-panel="${solo}"]`)?.classList.add('solo-on'); document.title = `Movie Royal — ${{ chat: 'Chat', alerts: 'Alerts', find: 'Find someone' }[solo] || 'Chat'}`; }
document.querySelectorAll('.pop').forEach(b => { if (!embed && (b.id === 'popAll' || solo)) b.style.display = 'none'; }); // a popped-out window can still pop out single panels
let msgs = [], alerts = [], stick = true, info = {};
/* one click on a name in chat or the alerts opens their profile (a double-click still does too) */
document.addEventListener('click', e => { const n = e.target.closest('#msgs .cn[data-user], #alerts b[data-user]'); if (n && n.dataset.user && window.Profile) Profile.open(n.dataset.user); });
/* 📜 (1.132.4) how chat scrolls: auto (follows, scroll up to pause) | hover (pauses while the mouse is over chat) | manual (you scroll it) */
let scrollMode = 'auto', hoverOn = false, unread = 0; try { const v = localStorage.getItem('chatScroll'); if (['auto', 'hover', 'manual'].includes(v)) scrollMode = v; } catch {} $('scrollMode').value = scrollMode;
const follows = () => scrollMode === 'manual' ? false : scrollMode === 'hover' ? stick && !hoverOn : stick;
function scrollSet(v) { scrollMode = ['auto', 'hover', 'manual'].includes(v) ? v : 'auto'; try { localStorage.setItem('chatScroll', scrollMode); } catch {} $('scrollMode').value = scrollMode; if (scrollMode !== 'manual') { stick = true; scrollDown(); } }
function pausedShow() { unread++; const p = $('paused'); p.textContent = `${scrollMode === 'manual' ? '✋' : '⏸'} ${unread} new message${unread === 1 ? '' : 's'}${scrollMode === 'hover' && hoverOn && stick ? ': paused while your mouse is over chat' : scrollMode === 'manual' ? '' : ': paused while you scroll'} — click to jump to them`; p.style.display = 'block'; }
function scrollDown() { const b = $('msgs'); b.scrollTop = b.scrollHeight; $('paused').style.display = 'none'; unread = 0; }
$('msgs').addEventListener('mouseenter', () => { hoverOn = true; }); $('msgs').addEventListener('mouseleave', () => { hoverOn = false; if (scrollMode === 'hover' && stick) scrollDown(); });
$('msgs').addEventListener('scroll', () => { const b = $('msgs'); stick = b.scrollHeight - b.scrollTop - b.clientHeight < 40; if (stick) { $('paused').style.display = 'none'; unread = 0; } });
const show = m => { const q = $('filter').value.trim().toLowerCase(); return !q || `${m.name} ${m.text}`.toLowerCase().includes(q); };
function drawAll() { $('msgs').innerHTML = msgs.filter(show).map(m => ChatUI.row(m, { tools: info.canMod || info.canDelete })).join('') || '<div class="muted" style="padding:10px">No chat yet. Messages show up here as they come in.</div>'; scrollDown(); }
function addMsg(m) { msgs.push(m); if (msgs.length > 1500) msgs.shift(); if (!show(m)) return; const b = $('msgs'); if (b.querySelector('.muted')) b.innerHTML = ''; b.insertAdjacentHTML('beforeend', ChatUI.row(m, { tools: info.canMod || info.canDelete })); if (b.children.length > 1500) b.firstChild.remove(); if (follows()) scrollDown(); else pausedShow(); }
function drawAlerts() { $('alerts').innerHTML = alerts.map(ChatUI.alertRow).join('') || '<div class="muted">Alerts show up here (subs, gift subs, bits, raids, follows, channel point redemptions, watch streaks and donations).</div>'; }
async function load() {
  info = await fetch('/api/chat/recent?n=500').then(r => r.json()); ChatUI.setAssets(info);
  msgs = info.messages; alerts = info.alerts; $('chanName').textContent = info.channel ? '#' + info.channel : 'Chat';
  $('permWarn').innerHTML = info.canMod && info.canDelete ? '' : `<div class="warn">🛡️ To delete messages, time out and ban from here, sign in with Twitch again once (Settings → Account) so Movie Royal gets the new mod permissions.</div>`;
  drawAll(); drawAlerts();
}
function connect() {
  const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=chatview`);
  ws.onmessage = e => { const m = JSON.parse(e.data);
    if (m.type === 'chatmsg') addMsg(m.msg);
    else if (m.type === 'chatBoth') { ChatUI.setAssets({ both: !!m.both }); drawAll(); } /* 💜🟢 both chats switched on / off: the T / K marks follow at once */
    else if (m.type === 'chatalert') { alerts.unshift(m.alert); alerts = alerts.slice(0, 200); drawAlerts(); }
    else if (m.type === 'chatclear') { for (const x of msgs) if ((m.id && x.id === m.id) || (m.login && x.login === m.login)) x.gone = m.id ? 'deleted' : m.duration ? `timed out ${m.duration}s` : 'banned'; drawAll(); } };
  ws.onclose = () => setTimeout(connect, 1500);
}
async function send(e) { e.preventDefault(); const t = $('sayTx').value.trim(); if (!t) return; const r = await fetch('/api/chat/say', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: t }) }).then(r => r.json()); if (r.error) alert('⚠️ ' + r.error); else $('sayTx').value = ''; }
let ft; function findWho() { clearTimeout(ft); ft = setTimeout(async () => {
  const who = $('who').value.trim(), what = $('what').value.trim(), box = $('found');
  if (!who && !what) { box.innerHTML = 'Type a name to find them. Click a name to copy it, double-click for their profile.'; return; }
  if (what) { const l = await fetch(`/api/chat/search?q=${encodeURIComponent(what)}&login=${encodeURIComponent(who.toLowerCase())}&days=90`).then(r => r.json()); box.innerHTML = l.length ? l.map(m => `<div style="margin:2px 0">${esc(new Date(m.at).toLocaleDateString())} ${ChatUI.row(m)}</div>`).join('') : 'Nothing found in the last 90 days.'; return; }
  const l = await fetch('/api/chat/names?q=' + encodeURIComponent(who)).then(r => r.json());
  box.innerHTML = l.length ? l.map(v => `<span class="pill" data-user="${esc(v.login)}" title="${v.msgs} messages · last seen ${esc(v.last ? new Date(v.last).toLocaleString() : '')}" onclick="copyName('${esc(v.login)}', this)">${esc(v.name)}</span>`).join('') : 'Nobody by that name has chatted yet.';
}, 250); }
function copyName(n, el) { navigator.clipboard?.writeText(n); const t = el.textContent; el.textContent = '✅ copied'; setTimeout(() => el.textContent = t, 900); }
function popOut(which) {
  const size = { chat: 'width=560,height=860', alerts: 'width=420,height=640', find: 'width=420,height=640', all: 'width=1100,height=860' }[which];
  window.open(which === 'all' ? '/chat.html' : '/chat.html?panel=' + which, 'royal-' + which, size);
}
const fit = () => document.body.classList.toggle('narrow', innerWidth < 760 && !solo); addEventListener('resize', fit); fit();
load(); connect();
</script>
<script src="spell.js"></script>
</body>
</html>
