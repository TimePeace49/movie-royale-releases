<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Royal celebration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<!-- 🎉 Viewer's choice: confetti and balloons over the whole screen, a big pop-up in the middle, for 10 seconds.
     Used two ways: the OBS browser source "Movie Royal celebration" (waits for a redeem), and the see-through window
     Movie Royal opens over your screen (?desk=1, the redeem comes in the address after #). Transparent when nothing is happening. -->
<style>
  :root { --gold:#ffd23a; --pink:#ff4fa3; --purple:#8a4bff; }
  html, body { margin:0; height:100%; overflow:hidden; background:transparent; }
  canvas { position:fixed; inset:0; width:100vw; height:100vh; pointer-events:none; }
  #pop { position:fixed; left:50%; top:50%; width:44vw; min-height:40vh; transform:translate(-50%,-50%) scale(0); opacity:0; box-sizing:border-box;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.4vh; padding:3vh 3vw; text-align:center;
    background:radial-gradient(circle at 50% 0%, #3a1a6a, #1a0b33 70%); border:.5vh solid var(--gold); border-radius:3vh;
    box-shadow:0 0 6vh #ffd23a99, 0 0 14vh #ff4fa366, inset 0 0 4vh #8a4bff55; color:#fff; font-family:Inter, system-ui, sans-serif; }
  #pop.on { animation:popIn .7s cubic-bezier(.2,1.6,.4,1) forwards, glow 1.2s ease-in-out .7s infinite alternate; }
  #pop.off { animation:popOut .6s ease-in forwards; }
  @keyframes popIn { 0% { transform:translate(-50%,-50%) scale(0) rotate(-8deg); opacity:0; } 100% { transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1; } }
  @keyframes popOut { to { transform:translate(-50%,-50%) scale(.2) rotate(6deg); opacity:0; } }
  @keyframes glow { to { box-shadow:0 0 9vh #ffd23acc, 0 0 20vh #ff4fa399, inset 0 0 5vh #8a4bff88; } }
  .burst { font-size:7vh; line-height:1; animation:bob .5s ease-in-out infinite alternate; }
  @keyframes bob { to { transform:translateY(-1vh) scale(1.08); } }
  h1 { margin:0; font-family:'Lilita One', Impact, sans-serif; font-weight:400; font-size:7.6vh; line-height:1; letter-spacing:.3vh;
    background:linear-gradient(90deg, #ffd23a, #ff8a3a, #ff4fa3, #8a4bff, #3ac8ff, #ffd23a); background-size:300% 100%; -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 .5vh 0 #0009); animation:shine 2.5s linear infinite; }
  @keyframes shine { to { background-position:300% 0; } }
  .who { display:flex; align-items:center; gap:1.4vh; font-size:4vh; font-weight:800; }
  .who img { width:7vh; height:7vh; border-radius:50%; border:.4vh solid var(--gold); }
  .says { font-size:3.4vh; font-weight:800; color:var(--gold); max-width:100%; overflow-wrap:anywhere; }
  .sub { font-size:2.2vh; opacity:.85; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="pop"></div>
<script src="/sfx.js"></script>
<script>
(() => {
  const q = new URLSearchParams(location.search), DESK = q.has('desk'), QUIET = q.has('quiet');
  const cv = document.getElementById('cv'), g = cv.getContext('2d'), pop = document.getElementById('pop');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const COLORS = ['#ffd23a', '#ff4fa3', '#8a4bff', '#3ac8ff', '#4cd97a', '#ff7a3a', '#ffffff'];
  let parts = [], balloons = [], until = 0, running = false, W = 0, H = 0, endT = null;
  const size = () => { const k = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * k; cv.height = H * k; g.setTransform(k, 0, 0, k, 0, 0); };
  addEventListener('resize', size); size();
  const R = (a, b) => a + Math.random() * (b - a), pick = a => a[Math.floor(Math.random() * a.length)];
  function confetti(x, y, n, up) { for (let i = 0; i < n; i++) { const a = up ? R(-Math.PI * .9, -Math.PI * .1) : R(0, Math.PI * 2), sp = R(300, 1100) * H / 1080; parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, w: R(6, 14), h: R(10, 22), r: R(0, 6), vr: R(-12, 12), c: pick(COLORS), life: R(5, 9) }); } }
  function balloon(delay) { const s = R(.7, 1.3) * H / 1080; balloons.push({ x: R(0, W), y: -R(120, 400) * s, vy: R(70, 150) * s, ph: R(0, 6), s, c: pick(COLORS.slice(0, 6)), delay }); }
  function drawBalloon(b, t) {
    const x = b.x + Math.sin(t * 1.4 + b.ph) * 18 * b.s, y = b.y, rw = 46 * b.s, rh = 58 * b.s;
    g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x, y + rh); for (let i = 1; i <= 6; i++) g.lineTo(x + Math.sin(t * 3 + i + b.ph) * 6 * b.s, y + rh + i * 22 * b.s); g.stroke(); // the string
    const gr = g.createRadialGradient(x - rw * .35, y - rh * .4, 2, x, y, rh * 1.2); gr.addColorStop(0, '#ffffffcc'); gr.addColorStop(.25, b.c); gr.addColorStop(1, b.c);
    g.fillStyle = gr; g.beginPath(); g.ellipse(x, y, rw, rh, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = b.c; g.beginPath(); g.moveTo(x - 7 * b.s, y + rh + 8 * b.s); g.lineTo(x + 7 * b.s, y + rh + 8 * b.s); g.lineTo(x, y + rh - 2); g.fill(); // the knot
  }
  let last = 0, t0 = 0;
  function frame(now) {
    const dt = Math.min(.05, (now - (last || now)) / 1000); last = now; const t = (now - t0) / 1000;
    g.clearRect(0, 0, W, H);
    if (t < 8.5 && Math.random() < .9) for (let i = 0; i < 3; i++) parts.push({ x: R(0, W), y: -20, vx: R(-60, 60), vy: R(120, 260), w: R(6, 12), h: R(9, 18), r: R(0, 6), vr: R(-8, 8), c: pick(COLORS), life: 7 }); // raining confetti, the whole screen
    for (const p of parts) { p.vy += 520 * dt * (p.vy > 300 ? .2 : 1); p.vx *= Math.pow(.6, dt); p.x += p.vx * dt + Math.sin(t * 3 + p.r) * 30 * dt; p.y += p.vy * dt; p.r += p.vr * dt; p.life -= dt;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.scale(1, Math.abs(Math.cos(t * 6 + p.r))); g.fillStyle = p.c; g.globalAlpha = Math.min(1, p.life); g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore(); }
    parts = parts.filter(p => p.life > 0 && p.y < H + 40);
    for (const b of balloons) { if (t < b.delay) continue; b.y += b.vy * dt; drawBalloon(b, t); }
    balloons = balloons.filter(b => b.y < H + 300);
    if (now < until || parts.length || balloons.some(b => b.y < H + 300 && t < 14)) requestAnimationFrame(frame); else { running = false; g.clearRect(0, 0, W, H); }
  }
  function show(m) {
    clearTimeout(endT); size();
    const ms = 10000; until = performance.now() + ms; t0 = performance.now();
    pop.className = ''; void pop.offsetWidth;
    pop.innerHTML = `<div class="burst">🎉🎈🎊</div><h1>${esc(m.headline || "VIEWER'S CHOICE!")}</h1>
      <div class="who">${m.avatar ? `<img src="${esc(m.avatar)}" alt="">` : ''}<span>${esc(m.name || 'A viewer')}</span></div>
      ${m.input ? `<div class="says">“${esc(m.input)}”</div>` : ''}<div class="sub">redeemed <b>Viewer's choice</b>! 🎉</div>`;
    pop.className = 'on';
    confetti(W * .5, H * .5, 220, false); confetti(0, H, 140, true); confetti(W, H, 140, true); // 🎊 the pop
    for (let i = 0; i < 26; i++) balloon(R(0, 3.5)); // 🎈 balloons coming down
    if (m.sound !== false && !QUIET && window.SFX) { try { SFX.init(); SFX.play('confettiPop'); setTimeout(() => SFX.play('crowdWild'), 250); setTimeout(() => SFX.play('fanfare'), 600); } catch {} }
    endT = setTimeout(() => { pop.className = 'off'; }, ms - 700);
    if (!running) { running = true; last = 0; requestAnimationFrame(frame); }
  }
  window.__celebrate = show; // (for testing)
  if (DESK) { try { const m = JSON.parse(decodeURIComponent(location.hash.slice(1))); if (window.SFX) SFX.setVolume({ on: (m.vol ?? .8) > 0, sfx: m.vol ?? .8, music: 0 }); show(m); } catch {} return; }
  // 📺 OBS browser source: wait for a Viewer's choice redeem
  function connect() {
    const ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=celebrate`);
    ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch { return; } if (m.type === 'audio' && window.SFX) SFX.setVolume({ on: m.on, sfx: m.sfx, music: 0 }); if (m.type === 'celebrate') show(m); };
    ws.onclose = () => setTimeout(connect, 2000);
  }
  connect();
})();
</script>
</body>
</html>
