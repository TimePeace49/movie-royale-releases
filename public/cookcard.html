<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Movie Royal cooking card</title>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  /* 🍳 (1.164.0, Derek picked layout A: "I need to fill up the space") the cooking scene's frame: sits BEHIND the three cameras.
     Cameras: big one 0,0 1440x810 · two small ones 1440,0 and 1440,270 (480x270). This page fills the rest: an info box under the small cameras and a bar along the bottom. */
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0d0a18; color: #fff; font-family: Inter, 'Segoe UI', sans-serif; }
  .slot { position: absolute; background: #07050f; }
  #info { position: absolute; left: 1452px; top: 552px; width: 456px; height: 246px; box-sizing: border-box; padding: 18px 24px; border-radius: 18px; background: linear-gradient(160deg, #2c1d55, #1a1233); border: 2px solid #9b7bff; display: flex; flex-direction: column; justify-content: center; }
  #info .l { font: 800 17px Inter; letter-spacing: 2px; opacity: .75; text-transform: uppercase; }
  #ck { font: 400 72px 'Lilita One', Inter, sans-serif; line-height: 1.05; font-variant-numeric: tabular-nums; }
  #ck.paused { opacity: .55; }
  #owed { font: 700 22px Inter; margin-top: 8px; opacity: .92; min-height: 27px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar { position: absolute; left: 0; top: 810px; width: 1920px; height: 270px; box-sizing: border-box; background: linear-gradient(90deg, #2a1a52, #431c5e 50%, #2a1a52); border-top: 4px solid #ff5fd2; }
  #ti { position: absolute; left: 48px; top: 846px; font: 400 84px 'Lilita One', Inter, sans-serif; letter-spacing: 2px; color: #ffd166; text-shadow: 0 4px 0 rgba(0,0,0,.55); white-space: nowrap; }
  #sub { position: absolute; left: 54px; top: 958px; width: 800px; font: 700 28px Inter; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #song { position: absolute; left: 900px; top: 838px; width: 980px; height: 214px; box-sizing: border-box; padding: 18px 26px; border-radius: 18px; background: rgba(18,11,40,.78); border: 2px solid #9b7bff; display: flex; flex-direction: column; justify-content: center; }
  #song .l { font: 800 17px Inter; letter-spacing: 2px; opacity: .75; }
  #st { font: 800 38px Inter; line-height: 1.15; margin: 4px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #sb { font: 600 22px Inter; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #song.sell #st { font-size: 30px; -webkit-line-clamp: 3; }
  #song.off { display: none; }
</style></head>
<body>
<div class="slot" style="left:0;top:0;width:1440px;height:810px"></div><div class="slot" style="left:1440px;top:0;width:480px;height:540px"></div>
<div id="info"><div class="l" id="ckl">Total live time</div><div id="ck">0:00:00</div><div id="owed"></div></div>
<div id="bar"></div><div id="ti">🍳 COOKING</div><div id="sub"></div>
<div id="song" class="off"><div class="l" id="sl"></div><div id="st"></div><div id="sb"></div></div>
<script>
const $ = id => document.getElementById(id), P = new URLSearchParams(location.search);
let CK = { on: false, ms: 0, live: false, got: 0 }, NP = { on: false }, SELL = '', TITLE = 'GTA 6 MARATHON';
const hms = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return Math.floor(s / 3600) + ':' + String(Math.floor(s / 60) % 60).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const ms = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function tick() {
  const el = $('ck'); if (CK.on) { el.textContent = hms(CK.ms + (CK.live ? Date.now() - CK.got : 0)); el.className = CK.live ? '' : 'paused'; $('ckl').textContent = CK.live ? 'Total live time' : 'Total live time (paused)'; }
  else { const d = new Date(); el.textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); el.className = ''; $('ckl').textContent = 'Time'; }
  if (NP.on) $('sb').textContent = (NP.by ? 'Asked by ' + NP.by + ' · ' : '') + ms(NP.t + (NP.paused ? 0 : (Date.now() - NP.got) / 1000)) + (NP.dur ? ' / ' + ms(NP.dur) : '') + (NP.paused ? ' · paused' : '');
}
function song() {
  const b = $('song');
  if (NP.on && NP.title) { b.className = ''; $('sl').textContent = '♫ NOW PLAYING'; $('st').textContent = NP.title; }
  else if (SELL) { b.className = 'sell'; $('sl').textContent = '📣 JOIN IN'; $('st').textContent = SELL; $('sb').textContent = ''; }
  else b.className = 'off';
  tick();
}
function count(m) { $('owed').textContent = m.on ? (m.paused ? '⏸ Battles paused' : m.owed ? `🎟️ Battles waiting: ${m.owed}` + (m.next?.length ? ' · next: ' + m.next[0] : '') : '🎟️ No battles waiting') : ''; }
function head() { $('sub').textContent = TITLE + ' · back to the game soon'; }
function on(m) {
  if (m.type === 'maraClock') { CK = { ...m, got: Date.now() }; tick(); }
  else if (m.type === 'maraCount') count(m);
  else if (m.type === 'sceneCard') { TITLE = m.title || TITLE; head(); }
  else if (m.type === 'songNow') { NP = { ...m, got: Date.now() }; song(); }
  else if (m.type === 'promo') { SELL = String(m.text || '').trim(); song(); }
}
function link(role) { const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?role=' + role); ws.onmessage = e => { try { on(JSON.parse(e.data)); } catch {} }; ws.onclose = () => setTimeout(() => link(role), 2500); }
head(); setInterval(tick, 500); window.__cook = on;
if (P.get('demo')) { on({ type: 'maraClock', on: true, ms: 45296000, live: true }); on({ type: 'maraCount', on: true, owed: 3, next: ['NightOwl_44'] }); if (P.get('demo') !== 'nosong') on({ type: 'songNow', on: true, title: 'Home Free - Sea Shanty Medley (Lyrics)', by: 'pretend_amy', t: 83, dur: 225 }); else on({ type: 'promo', text: '🎟️ Buy a battle to make me try a food or do a workout: $5 · 500 bits · 1 sub   🌀 Mess with my screen: 2,500 points' }); }
else { link('mara'); link('nowplay'); link('promo'); }
// (same as the other scene cards: nothing to animate, so nothing to pause when the source is hidden)
</script></body></html>
