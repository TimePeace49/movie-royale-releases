    <path d="M100 98 L110 108 L100 118 L90 108 Z" fill="#7a4f0c"/>
    <path d="M62 98 Q100 84 140 98 M62 138 Q100 126 140 138" fill="none" stroke-width="2"/>
    <!-- four finger lames curled into a fist -->
    <path d="M52 66 Q50 42 62 34 L80 34 Q86 42 84 66 Z" fill="url(#g)"/>
    <path d="M84 66 Q82 34 94 26 L112 26 Q118 34 116 66 Z" fill="url(#g)"/>
    <path d="M116 66 Q114 36 126 30 L142 30 Q150 38 148 66 Z" fill="url(#g)"/>
    <path d="M148 70 Q150 48 160 44 L172 46 Q178 56 172 92 L152 96 Z" fill="url(#g)"/>
    <path d="M54 50 L82 50 M86 44 L114 44 M118 46 L146 46 M152 62 L174 64" fill="none" stroke-width="2"/>
