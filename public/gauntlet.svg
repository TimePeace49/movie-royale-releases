<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- An original forged golden gauntlet (dwarven plate armor): the 🎡 wheel's VOID symbol -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff1a8"/><stop offset=".35" stop-color="#f2c24a"/><stop offset=".7" stop-color="#c58a1c"/><stop offset="1" stop-color="#7a4f0c"/></linearGradient>
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0a93a"/><stop offset="1" stop-color="#6b430a"/></linearGradient>
    <radialGradient id="h" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff7cf" stop-opacity=".9"/><stop offset="1" stop-color="#fff7cf" stop-opacity="0"/></radialGradient>
  </defs>
  <g stroke="#4a2e05" stroke-width="3" stroke-linejoin="round">
