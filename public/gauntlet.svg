    <path d="M48 96 Q24 94 20 118 Q22 138 44 140 L52 136 Z" fill="url(#g)"/>
    <path d="M26 116 L48 112" fill="none" stroke-width="2"/>
  </g>
  <!-- rivets -->
  <g fill="#fff1a8" stroke="#4a2e05" stroke-width="1.5">
    <circle cx="60" cy="160" r="4"/><circle cx="100" cy="160" r="4"/><circle cx="140" cy="160" r="4"/>
    <circle cx="52" cy="220" r="4"/><circle cx="100" cy="220" r="4"/><circle cx="148" cy="220" r="4"/>
    <circle cx="60" cy="80" r="3.5"/><circle cx="142" cy="80" r="3.5"/><circle cx="60" cy="142" r="3.5"/><circle cx="142" cy="142" r="3.5"/>
  </g>
  <path d="M60 74 Q100 64 140 74 L136 100 Q100 90 64 100 Z" fill="url(#h)"/>
