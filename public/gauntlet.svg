    <path d="M52 150 L148 150 L162 232 L38 232 Z" fill="url(#d)"/>
    <path d="M46 176 L154 176" fill="none" stroke-width="2.5"/>
    <path d="M42 204 L158 204" fill="none" stroke-width="2.5"/>
    <path d="M60 188 q40 -10 80 0" fill="none" stroke="#fff1a8" stroke-opacity=".5" stroke-width="2"/>
