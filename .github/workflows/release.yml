# Builds the Windows installer and publishes a GitHub Release.
# How to use: on GitHub go to Actions → "Build & release" → Run workflow → type the version (e.g. 1.2.0) → Run.
# (Pushing a tag like v1.2.0 does the same thing.)
# Every copy built here checks THIS repo for updates automatically.
name: Build & release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, like 1.2.0 (must be higher than the last release)"
        required: true
      latest:
        description: "Make it the latest release (everyone gets it). Leave off for a pre-release (test build)."
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Work out the version
        id: v
        run: |
          V="${{ github.event.inputs.version }}"
          if [ -z "$V" ]; then V="${GITHUB_REF_NAME#v}"; fi
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Check the pages for mistakes
        run: node scripts/check-pages.mjs

      - name: Install
        run: npm ci

      - name: Stamp version + update source
        run: |
          npm pkg set version="${{ steps.v.outputs.version }}"
          npm pkg set updateRepo="${{ github.repository }}"

      - name: Build installer
        run: npm run build:win

      - name: Write the release notes
        run: |
          V="${{ steps.v.outputs.version }}"
          {
            if [ "${{ github.event.inputs.latest }}" = "true" ]; then
              # the newest section of PATCHNOTES.md (everything since the last latest release)
              awk '/^## v/{n++} n==1' PATCHNOTES.md | sed '1s/^## .*/## What'"'"'s new/'
              echo
            fi
            echo "## ⬇️ Download"
            echo "Grab **MovieRoyal-Setup-$V.exe** below and run it."
            echo "Already have Movie Royal? It will offer this update the next time it opens."
            if [ "${{ github.event.inputs.latest }}" != "true" ]; then
              echo
              echo '> 🧪 **This is a test build (pre-release).** Only copies with "Also install test builds" turned on (Settings → Account & updates) will offer it.'
            fi
            echo
            echo 'If Windows says "Windows protected your PC", click **More info → Run anyway** (the app isn'"'"'t code-signed).'
            echo
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for every change."
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Movie Royal ${{ steps.v.outputs.version }}${{ github.event.inputs.latest != 'true' && ' (test build)' || '' }}
          prerelease: ${{ github.event.inputs.latest != 'true' }}
          make_latest: ${{ github.event.inputs.latest == 'true' && 'true' || 'false' }}
          files: dist/MovieRoyal-Setup-${{ steps.v.outputs.version }}.exe
          body_path: release-notes.md
